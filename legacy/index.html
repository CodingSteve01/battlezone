<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Shadow Squad - Taktisches Teamspiel</title>
    <link rel="stylesheet" href="css/styles.css?v=1.1">
</head>
<body>
    <div id="app">
        <!-- MENU SCREEN -->
        <div id="menu" class="screen active">
            <div class="menu-header">
                <h1 class="menu-title">SHADOW SQUAD</h1>
            </div>

            <div class="menu-section">
                <div class="option-grid two-col">
                    <button class="option-btn mode-btn selected" data-mode="multi">
                        <span class="mode-icon">👥</span>
                        <span>Mehrspieler</span>
                    </button>
                    <button class="option-btn mode-btn" data-mode="single">
                        <span class="mode-icon">🤖</span>
                        <span>Einzelspieler</span>
                    </button>
                </div>
            </div>

            <div class="menu-section" id="players-section">
                <div class="option-grid">
                    <button class="option-btn selected" data-players="2">2 Spieler</button>
                    <button class="option-btn" data-players="3">3 Spieler</button>
                    <button class="option-btn" data-players="4">4 Spieler</button>
                </div>
            </div>

            <div class="menu-section">
                <div class="option-grid">
                    <button class="option-btn" data-size="small">S</button>
                    <button class="option-btn selected" data-size="medium">M</button>
                    <button class="option-btn" data-size="large">L</button>
                </div>
            </div>

            <div class="menu-section audio-section">
                <div class="audio-controls">
                    <span class="audio-label">🔊 Lautstärke</span>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70">
                    <button class="mute-btn" id="mute-btn" title="Ton an/aus">🔊</button>
                </div>
            </div>

            <div class="menu-section effects-section">
                <div class="effects-controls">
                    <label class="toggle-label" for="gore-toggle">
                        <input type="checkbox" id="gore-toggle" class="toggle-checkbox">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">🩸 Blut-Effekte</span>
                    </label>
                    <span class="toggle-hint">(Für Erwachsene)</span>
                </div>
            </div>

            <button class="start-btn" id="start-btn">Start</button>

            <button class="help-toggle" id="help-toggle">
                <span>?</span> Hilfe
            </button>

            <div class="help-panel" id="help-panel">
                <p>Ziehen = Scrollen • Tippen = Aktion • 4 AP pro Zug</p>
            </div>

            <div class="version-info" id="version-info">
                Version DEV • Build: --
            </div>
        </div>

        <!-- TEAM SELECTION SCREEN -->
        <div id="team-select" class="screen">
            <button class="back-btn" id="team-back-btn">← Zurück</button>
            <div class="team-select-header">
                <div class="team-select-badge" id="team-select-badge">1</div>
                <h2 class="team-select-title">Spieler <span id="team-select-player">1</span></h2>
            </div>

            <div class="team-select-grid" id="team-select-grid">
                <!-- Unit cards will be generated by JS -->
            </div>

            <div class="team-select-preview">
                <div class="team-preview-units" id="team-preview-units">
                    <div class="team-slot empty">?</div>
                    <div class="team-slot empty">?</div>
                    <div class="team-slot empty">?</div>
                </div>
            </div>

            <button class="start-btn team-confirm-btn" id="team-confirm-btn" disabled>Weiter</button>
        </div>

        <!-- TURN SCREEN -->
        <div id="turn-screen" class="screen">
            <button class="back-btn" id="turn-back-btn">← Menü</button>
            <div class="turn-badge" id="turn-badge">1</div>
            <h2 class="turn-title">Spieler <span id="turn-num">1</span></h2>
            <p class="turn-hint">Gerät weitergeben!</p>
            <button class="ready-btn" id="ready-btn">Bereit</button>
        </div>

        <!-- GAME AREA -->
        <div id="game-area">
            <div class="top-bar">
                <div class="player-indicator">
                    <div class="player-dot" id="current-dot"></div>
                    <span class="player-name" id="current-name">Spieler 1</span>
                </div>
                <div class="round-info">
                    <div class="round-badge">Runde <span id="round-num">1</span>/15</div>
                    <div class="ap-display" id="ap-display"></div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="game-canvas"></canvas>
                <div class="target-info" id="target-info">
                    <div class="hit-chance" id="hit-chance">75%</div>
                    <div class="damage" id="damage-info">~25</div>
                    <div class="cover-info" id="cover-info"></div>
                    <div class="attack-hint">Erneut tippen zum Angreifen</div>
                </div>
            </div>

            <div class="unit-panel">
                <div class="unit-tabs" id="unit-tabs"></div>
                <div class="action-row">
                    <button class="action-btn cover-btn" data-action="cover" title="Deckung nehmen (1 AP)">
                        <span class="icon">🌲</span>
                        <span class="label" id="cover-label">Deckung</span>
                    </button>
                    <button class="action-btn special-btn" data-action="special" title="Spezialfähigkeit (2 AP)">
                        <span class="icon">✨</span>
                        <span class="label" id="special-label">Spezial</span>
                        <span class="special-tip" id="special-tip"></span>
                    </button>
                    <button class="end-turn-btn" id="end-turn-btn">Zug beenden</button>
                </div>
            </div>
            <div class="bottom-safe"></div>
        </div>

        <!-- GAME OVER -->
        <div id="gameover" class="screen">
            <div class="winner-icon">🏆</div>
            <h2 class="winner-text" id="winner-text">Spieler 1 gewinnt!</h2>
            <button class="go-btn primary" id="rematch-btn">Nochmal</button>
            <button class="go-btn secondary" id="menu-btn">Menü</button>
        </div>
    </div>

    <script type="module" src="js/main.js?v=1.1"></script>
</body>
</html>
