<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fahrzeugkampf-Spiel</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Startbildschirm -->
  <div class="screen-overlay" id="startScreen">
    <h1>Fahrzeugkampf-Spiel</h1>
    <button id="cooperativeBtn">Kooperativ</button>
    <button id="versusBtn">Versus</button>
  </div>
  
  <!-- Game Over Bildschirm -->
  <div class="screen-overlay hidden" id="gameOverScreen">
    <h1>Spiel vorbei!</h1>
    <p id="gameOverMessage">Du bist gestorben.</p>
    <button id="restartBtn">Neustarten</button>
  </div>
  
  <div class="game-container" id="gameContainer" style="display: none;">
    <div class="player-screen">
      <canvas id="canvas1"></canvas>
      <div class="ui">
        <div class="stats">
          <strong>Player 1</strong><br>
          HP: <span id="health1">100</span><br>
          Ammo: <span id="ammo1">30</span><br>
          Weapon: <span id="weapon1">Pistole</span><br>
          Vehicle: <span id="vehicle1">None</span><br>
          Position: (<span id="posX1">0</span>, <span id="posY1">0</span>)
        </div>
        <div class="message" id="message1"></div>
        <canvas class="minimap1" id="minimap1"></canvas>
      </div>
    </div>
    <div class="player-screen">
      <canvas id="canvas2"></canvas>
      <div class="ui">
        <div class="stats">
          <strong>Player 2</strong><br>
          HP: <span id="health2">100</span><br>
          Ammo: <span id="ammo2">30</span><br>
          Weapon: <span id="weapon2">Pistole</span><br>
          Vehicle: <span id="vehicle2">None</span><br>
          Position: (<span id="posX2">0</span>, <span id="posY2">0</span>)
        </div>
        <div class="message" id="message2"></div>
        <canvas class="minimap2" id="minimap2"></canvas>
      </div>
    </div>
  </div>
  <div class="mode-display" id="modeDisplay">Mode: Kooperativ</div>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
