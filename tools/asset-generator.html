<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Squad - Asset Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #22c55e;
            border-bottom: 2px solid #22c55e;
            padding-bottom: 10px;
        }
        h2 {
            color: #3b82f6;
            margin-top: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            background: #2a2a4e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #16a34a;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        button.secondary {
            background: #3b82f6;
        }
        button.secondary:hover {
            background: #2563eb;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .preview-item {
            background: #2a2a4e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .preview-item canvas {
            border: 1px solid #444;
            background: #333;
            max-width: 100%;
        }
        .preview-item .name {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
            word-break: break-all;
        }
        .progress {
            background: #333;
            border-radius: 4px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #22c55e, #16a34a);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .log {
            background: #0a0a15;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .log-entry {
            margin: 3px 0;
        }
        .log-entry.success { color: #22c55e; }
        .log-entry.info { color: #3b82f6; }
        .log-entry.warning { color: #eab308; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Shadow Squad Asset Generator</h1>
        <p>This tool generates all static PNG assets for the game. Click a button to generate and download assets.</p>

        <div class="controls">
            <button id="btn-all" onclick="generateAll()">Generate All Assets</button>
            <button id="btn-terrain" class="secondary" onclick="generateTerrain()">Terrain Only</button>
            <button id="btn-units" class="secondary" onclick="generateUnits()">Units Only</button>
            <button id="btn-details" class="secondary" onclick="generateDetails()">Details Only</button>
            <div class="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="log" id="log"></div>
        </div>

        <h2>Terrain Textures</h2>
        <div class="preview-grid" id="terrain-preview"></div>

        <h2>Unit Sprites</h2>
        <div class="preview-grid" id="units-preview"></div>

        <h2>Terrain Details</h2>
        <div class="preview-grid" id="details-preview"></div>
    </div>

    <script type="module">
        // ===== CONFIGURATION =====
        // Increased from 128 to 256 for higher quality textures
        const TEXTURE_SIZE = 256;
        const UNIT_SIZE = 90;
        const DETAIL_SIZE = 256;

        const PLAYER_COLORS = ['#22c55e', '#ef4444', '#3b82f6', '#eab308'];
        const UNIT_CLASSES = ['scout', 'assault', 'medic', 'sniper', 'ninja'];
        const TERRAIN_TYPES = ['grass', 'forest', 'rock', 'water', 'sand', 'swamp', 'hills', 'road', 'path', 'river'];

        // Store generated assets
        const assets = {
            terrain: [],
            units: [],
            details: []
        };

        // Deterministic RNG for reproducible asset generation
        const ASSET_RANDOM_SEED = 1337;
        let randomSeed = ASSET_RANDOM_SEED;

        function resetRandomSeed(seed = ASSET_RANDOM_SEED) {
            randomSeed = seed >>> 0;
        }

        function nextRandom() {
            randomSeed = (randomSeed * 1664525 + 1013904223) % 4294967296;
            return randomSeed / 4294967296;
        }

        Math.random = nextRandom;

        // ===== UTILITY FUNCTIONS =====

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setProgress(percent) {
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function addPreview(container, canvas, name) {
            const div = document.createElement('div');
            div.className = 'preview-item';

            const previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvas.width;
            previewCanvas.height = canvas.height;
            const ctx = previewCanvas.getContext('2d');
            ctx.drawImage(canvas, 0, 0);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.textContent = name;

            div.appendChild(previewCanvas);
            div.appendChild(nameDiv);
            document.getElementById(container).appendChild(div);
        }

        // Perlin-like noise for realistic textures
        function noise2D(x, y, seed = 0) {
            const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y, seed = 0) {
            const x0 = Math.floor(x);
            const y0 = Math.floor(y);
            const fx = x - x0;
            const fy = y - y0;

            const v00 = noise2D(x0, y0, seed);
            const v10 = noise2D(x0 + 1, y0, seed);
            const v01 = noise2D(x0, y0 + 1, seed);
            const v11 = noise2D(x0 + 1, y0 + 1, seed);

            const i1 = v00 * (1 - fx) + v10 * fx;
            const i2 = v01 * (1 - fx) + v11 * fx;

            return i1 * (1 - fy) + i2 * fy;
        }

        function fractalNoise(x, y, octaves = 4, seed = 0) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;

            for (let i = 0; i < octaves; i++) {
                value += smoothNoise(x * frequency, y * frequency, seed + i * 100) * amplitude;
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }

            return value / maxValue;
        }

        function seededRandom(seed) {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        }

        function applyCamoPattern(ctx, x, y, width, height, colors, density = 12) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, width, height);
            ctx.clip();

            for (let i = 0; i < density; i++) {
                const px = x + Math.random() * width;
                const py = y + Math.random() * height;
                const w = 4 + Math.random() * 8;
                const h = 3 + Math.random() * 6;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.ellipse(px, py, w, h, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ===== DETAIL SPRITE LIBRARY =====
        // Small reusable sprites that get composited onto textures

        /**
         * Draw a grass tuft (cluster of blades)
         */
        function drawGrassTuft(ctx, x, y, size, color, sway = 0) {
            const blades = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < blades; i++) {
                const bladeX = x + (Math.random() - 0.5) * size * 0.6;
                const height = size * (0.6 + Math.random() * 0.4);
                const lean = sway + (Math.random() - 0.5) * size * 0.3;
                const shade = 0.7 + Math.random() * 0.3;

                ctx.strokeStyle = `rgba(${Math.floor(color.r * shade)}, ${Math.floor(color.g * shade)}, ${Math.floor(color.b * shade)}, 0.9)`;
                ctx.lineWidth = 0.8 + Math.random() * 0.4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(bladeX, y);
                ctx.quadraticCurveTo(bladeX + lean * 0.4, y - height * 0.6, bladeX + lean, y - height);
                ctx.stroke();
            }
        }

        /**
         * Draw a fern frond
         */
        function drawFern(ctx, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            const stemHeight = size;
            const rotation = (Math.random() - 0.5) * 0.4;
            ctx.rotate(rotation);

            // Stem
            ctx.strokeStyle = `rgb(${color.r - 20}, ${color.g - 10}, ${color.b - 15})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -stemHeight);
            ctx.stroke();

            // Fronds (leaves on each side)
            const frondPairs = 4 + Math.floor(Math.random() * 3);
            for (let i = 0; i < frondPairs; i++) {
                const yPos = -stemHeight * (0.2 + i * 0.15);
                const frondSize = size * 0.3 * (1 - i * 0.12);

                for (let side = -1; side <= 1; side += 2) {
                    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.85)`;
                    ctx.beginPath();
                    ctx.moveTo(0, yPos);
                    ctx.quadraticCurveTo(side * frondSize * 0.6, yPos - frondSize * 0.3, side * frondSize, yPos);
                    ctx.quadraticCurveTo(side * frondSize * 0.4, yPos + frondSize * 0.2, 0, yPos);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        /**
         * Draw a small mushroom
         */
        function drawMushroom(ctx, x, y, size, capColor, stemColor) {
            // Stem
            ctx.fillStyle = stemColor;
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.2, size * 0.15, size * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cap
            ctx.fillStyle = capColor;
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.5, size * 0.35, size * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cap highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.ellipse(x - size * 0.1, y - size * 0.55, size * 0.1, size * 0.06, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * Draw a small flower
         */
        function drawSmallFlower(ctx, x, y, size, petalColor, centerColor) {
            // Stem
            ctx.strokeStyle = 'rgba(60, 90, 40, 0.8)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + (Math.random() - 0.5) * 2, y - size * 0.8);
            ctx.stroke();

            // Petals
            const petals = 4 + Math.floor(Math.random() * 2);
            for (let i = 0; i < petals; i++) {
                const angle = (i / petals) * Math.PI * 2;
                const px = x + Math.cos(angle) * size * 0.25;
                const py = y - size * 0.8 + Math.sin(angle) * size * 0.25;

                ctx.fillStyle = petalColor;
                ctx.beginPath();
                ctx.ellipse(px, py, size * 0.15, size * 0.08, angle, 0, Math.PI * 2);
                ctx.fill();
            }

            // Center
            ctx.fillStyle = centerColor;
            ctx.beginPath();
            ctx.arc(x, y - size * 0.8, size * 0.1, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * Draw a pebble/small rock
         */
        function drawPebble(ctx, x, y, size, color) {
            const shade = 0.8 + Math.random() * 0.2;
            ctx.fillStyle = `rgb(${Math.floor(color.r * shade)}, ${Math.floor(color.g * shade)}, ${Math.floor(color.b * shade)})`;
            ctx.beginPath();
            ctx.ellipse(x, y, size * (0.8 + Math.random() * 0.4), size * (0.5 + Math.random() * 0.3), Math.random() * Math.PI, 0, Math.PI * 2);
            ctx.fill();

            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.ellipse(x - size * 0.2, y - size * 0.1, size * 0.2, size * 0.1, -0.5, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * Draw a twig/small branch
         */
        function drawTwig(ctx, x, y, length, color) {
            const angle = Math.random() * Math.PI * 2;
            ctx.strokeStyle = color;
            ctx.lineWidth = 0.8 + Math.random() * 0.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x, y);
            const endX = x + Math.cos(angle) * length;
            const endY = y + Math.sin(angle) * length;
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Small branch
            if (Math.random() > 0.5) {
                const midX = x + Math.cos(angle) * length * 0.6;
                const midY = y + Math.sin(angle) * length * 0.6;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX + Math.cos(angle + 0.8) * length * 0.3, midY + Math.sin(angle + 0.8) * length * 0.3);
                ctx.stroke();
            }
        }

        /**
         * Draw a clover patch
         */
        function drawClover(ctx, x, y, size, color) {
            const leaves = 3 + (Math.random() > 0.9 ? 1 : 0); // Rare 4-leaf
            for (let i = 0; i < leaves; i++) {
                const angle = (i / leaves) * Math.PI * 2 - Math.PI / 2;
                const lx = x + Math.cos(angle) * size * 0.3;
                const ly = y + Math.sin(angle) * size * 0.3;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(lx, ly, size * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }
            // Stem
            ctx.strokeStyle = 'rgba(50, 80, 35, 0.7)';
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + size * 0.5);
            ctx.stroke();
        }

        // ===== IMAGE FILTERS =====

        /**
         * Apply contrast and saturation adjustment to canvas
         */
        function applyColorFilter(ctx, width, height, contrast = 1.0, saturation = 1.0, brightness = 1.0) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // Brightness
                r *= brightness;
                g *= brightness;
                b *= brightness;

                // Contrast
                r = ((r / 255 - 0.5) * contrast + 0.5) * 255;
                g = ((g / 255 - 0.5) * contrast + 0.5) * 255;
                b = ((b / 255 - 0.5) * contrast + 0.5) * 255;

                // Saturation
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                r = gray + saturation * (r - gray);
                g = gray + saturation * (g - gray);
                b = gray + saturation * (b - gray);

                data[i] = Math.max(0, Math.min(255, r));
                data[i + 1] = Math.max(0, Math.min(255, g));
                data[i + 2] = Math.max(0, Math.min(255, b));
            }

            ctx.putImageData(imageData, 0, 0);
        }

        /**
         * Add film grain effect for natural look
         */
        function addGrain(ctx, width, height, amount = 0.03) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * amount * 255;
                data[i] = Math.max(0, Math.min(255, data[i] + noise));
                data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
            }

            ctx.putImageData(imageData, 0, 0);
        }

        /**
         * Add vignette effect (darker edges)
         */
        function addVignette(ctx, width, height, amount = 0.15) {
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height) * 0.7
            );
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(1, `rgba(0, 0, 0, ${amount})`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // ===== ENHANCED TERRAIN GENERATORS =====

        /**
         * Create realistic grass texture with layered details
         */
        function createEnhancedGrassTexture(variant = 0, animFrame = -1) {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            // Animation sway offset
            const sway = animFrame >= 0 ? Math.sin(animFrame * Math.PI / 2) * 3 : 0;

            // Layer 1: Base soil/earth with noise
            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n1 = fractalNoise(x / 20, y / 20, 4, variant * 100);
                    const n2 = fractalNoise(x / 8, y / 8, 2, variant * 100 + 50);
                    const combined = n1 * 0.7 + n2 * 0.3;

                    // Earth brown base
                    const r = Math.floor(55 + combined * 20 + n2 * 10);
                    const g = Math.floor(45 + combined * 15 + n2 * 8);
                    const b = Math.floor(35 + combined * 10);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            // Layer 2: Green grass coverage with patches
            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n = fractalNoise(x / 15, y / 15, 5, variant * 100 + 200);
                    if (n > 0.3) {
                        const intensity = (n - 0.3) / 0.7;
                        const r = Math.floor(40 + intensity * 30);
                        const g = Math.floor(75 + intensity * 50);
                        const b = Math.floor(35 + intensity * 25);
                        ctx.fillStyle = `rgba(${r},${g},${b},${0.6 + intensity * 0.4})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            // Layer 3: Detail sprites
            const grassColor = { r: 45, g: 95, b: 40 };
            const darkGrassColor = { r: 30, g: 70, b: 30 };

            // Grass tufts
            for (let i = 0; i < 40; i++) {
                const x = seededRandom(variant * 1000 + i) * TEXTURE_SIZE;
                const y = seededRandom(variant * 1000 + i + 500) * TEXTURE_SIZE;
                const size = 6 + seededRandom(variant * 1000 + i + 1000) * 8;
                const color = seededRandom(variant * 1000 + i + 1500) > 0.5 ? grassColor : darkGrassColor;
                drawGrassTuft(ctx, x, y, size, color, sway);
            }

            // Occasional clovers
            for (let i = 0; i < 8; i++) {
                const x = seededRandom(variant * 2000 + i) * TEXTURE_SIZE;
                const y = seededRandom(variant * 2000 + i + 100) * TEXTURE_SIZE;
                drawClover(ctx, x, y, 4 + seededRandom(variant * 2000 + i + 200) * 3, 'rgba(50, 90, 40, 0.8)');
            }

            // Small flowers (rare)
            for (let i = 0; i < 3; i++) {
                if (seededRandom(variant * 3000 + i) > 0.6) {
                    const x = seededRandom(variant * 3000 + i + 100) * TEXTURE_SIZE;
                    const y = seededRandom(variant * 3000 + i + 200) * TEXTURE_SIZE;
                    const colors = [
                        { petal: 'rgba(255, 255, 200, 0.8)', center: 'rgba(255, 200, 50, 0.9)' },
                        { petal: 'rgba(200, 180, 255, 0.8)', center: 'rgba(255, 220, 100, 0.9)' },
                        { petal: 'rgba(255, 200, 200, 0.8)', center: 'rgba(255, 180, 80, 0.9)' }
                    ];
                    const colorSet = colors[Math.floor(seededRandom(variant * 3000 + i + 300) * colors.length)];
                    drawSmallFlower(ctx, x, y, 5 + seededRandom(variant * 3000 + i + 400) * 3, colorSet.petal, colorSet.center);
                }
            }

            // Pebbles
            for (let i = 0; i < 5; i++) {
                const x = seededRandom(variant * 4000 + i) * TEXTURE_SIZE;
                const y = seededRandom(variant * 4000 + i + 100) * TEXTURE_SIZE;
                drawPebble(ctx, x, y, 2 + seededRandom(variant * 4000 + i + 200) * 2, { r: 100, g: 95, b: 85 });
            }

            // Layer 4: Final filters
            applyColorFilter(ctx, TEXTURE_SIZE, TEXTURE_SIZE, 1.1, 1.05, 1.0);
            addGrain(ctx, TEXTURE_SIZE, TEXTURE_SIZE, 0.02);

            return canvas;
        }

        /**
         * Create realistic water texture with animation support
         */
        function createEnhancedWaterTexture(variant = 0, animFrame = -1) {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            // Animation phase offset
            const phase = animFrame >= 0 ? animFrame * Math.PI / 2 : 0;

            // Layer 1: Deep water base
            const baseGradient = ctx.createLinearGradient(0, 0, TEXTURE_SIZE, TEXTURE_SIZE);
            baseGradient.addColorStop(0, '#1a4a6e');
            baseGradient.addColorStop(0.5, '#0f3555');
            baseGradient.addColorStop(1, '#1a4a6e');
            ctx.fillStyle = baseGradient;
            ctx.fillRect(0, 0, TEXTURE_SIZE, TEXTURE_SIZE);

            // Layer 2: Caustics/light patterns
            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n1 = fractalNoise((x + phase * 5) / 25, (y + phase * 3) / 25, 3, variant * 100);
                    const n2 = fractalNoise((x - phase * 3) / 18, (y + phase * 4) / 18, 2, variant * 100 + 50);
                    const caustic = n1 * 0.6 + n2 * 0.4;

                    if (caustic > 0.5) {
                        const intensity = (caustic - 0.5) * 2;
                        ctx.fillStyle = `rgba(100, 180, 220, ${intensity * 0.25})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            // Layer 3: Wave highlights
            ctx.strokeStyle = 'rgba(150, 200, 230, 0.3)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 5; i++) {
                const yBase = 12 + i * 22;
                ctx.beginPath();
                ctx.moveTo(0, yBase);
                for (let x = 0; x <= TEXTURE_SIZE; x += 4) {
                    const waveY = yBase + Math.sin((x / 12) + phase + i * 0.7) * 3 +
                                  Math.sin((x / 8) + phase * 1.3 + i) * 2;
                    ctx.lineTo(x, waveY);
                }
                ctx.stroke();
            }

            // Layer 4: Sparkle highlights
            for (let i = 0; i < 15; i++) {
                const sparkleX = seededRandom(variant * 5000 + i + phase * 10) * TEXTURE_SIZE;
                const sparkleY = seededRandom(variant * 5000 + i + 100 + phase * 10) * TEXTURE_SIZE;
                const sparkleSize = 1 + seededRandom(variant * 5000 + i + 200) * 3;

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(x, y, 20 + Math.random() * 15, 12 + Math.random() * 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = `rgba(60, 50, 35, ${0.3 + Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.ellipse(Math.random() * TEXTURE_SIZE, Math.random() * TEXTURE_SIZE, 8 + Math.random() * 12, 5 + Math.random() * 8, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 15; i++) {
                ctx.fillStyle = `rgba(70, 85, 60, ${0.4 + Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.random() * TEXTURE_SIZE, Math.random() * TEXTURE_SIZE, 1 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 10; i++) {
                ctx.strokeStyle = `rgba(90, 75, 50, ${0.4 + Math.random() * 0.3})`;
                ctx.lineWidth = 1 + Math.random();
                ctx.beginPath();
                const x = Math.random() * TEXTURE_SIZE;
                const y = Math.random() * TEXTURE_SIZE;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 8, y - 10 - Math.random() * 15);
                ctx.stroke();
            }

            return canvas;
        }

        function createHillsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n = fractalNoise(x / 22, y / 22, 4, 8);
                    const r = Math.floor(75 + n * 25);
                    const g = Math.floor(90 + n * 35);
                    const b = Math.floor(60 + n * 20);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            ctx.strokeStyle = 'rgba(60, 80, 50, 0.3)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 4; i++) {
                const yOffset = 20 + i * 25;
                ctx.beginPath();
                ctx.moveTo(0, yOffset);
                for (let x = 0; x <= TEXTURE_SIZE; x += 10) {
                    const wobble = Math.sin(x / 15 + i * 0.7) * 5;
                    ctx.lineTo(x, yOffset + wobble);
                }
                ctx.stroke();
            }

            for (let i = 0; i < 15; i++) {
                const rx = Math.random() * TEXTURE_SIZE;
                const ry = Math.random() * TEXTURE_SIZE;
                const grayVal = 90 + Math.random() * 30;
                ctx.fillStyle = `rgba(${grayVal}, ${grayVal - 5}, ${grayVal - 10}, 0.6)`;
                ctx.beginPath();
                ctx.ellipse(rx, ry, 2 + Math.random() * 3, 1 + Math.random() * 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n = fractalNoise(x / 18, y / 18, 3, 9);
                    const r = Math.floor(100 + n * 25);
                    const g = Math.floor(85 + n * 20);
                    const b = Math.floor(70 + n * 15);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            for (let i = 0; i < 20; i++) {
                const rx = Math.random() * TEXTURE_SIZE;
                const ry = Math.random() * TEXTURE_SIZE;
                const size = 8 + Math.random() * 6;
                ctx.strokeStyle = 'rgba(70, 60, 50, 0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(rx - size / 2, ry - size / 2, size, size * 0.7, size * 0.1);
                ctx.stroke();
            }

            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = 'rgba(80, 70, 55, 0.25)';
                ctx.beginPath();
                ctx.ellipse(Math.random() * TEXTURE_SIZE, Math.random() * TEXTURE_SIZE, 10 + Math.random() * 15, 3 + Math.random() * 5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        function createPathTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n = fractalNoise(x / 16, y / 16, 4, 10);
                    const r = Math.floor(85 + n * 25);
                    const g = Math.floor(75 + n * 20);
                    const b = Math.floor(60 + n * 15);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            for (let i = 0; i < 10; i++) {
                const px = Math.random() * TEXTURE_SIZE;
                const py = Math.random() * TEXTURE_SIZE;
                ctx.fillStyle = `rgba(70, 60, 50, ${0.2 + Math.random() * 0.15})`;
                ctx.beginPath();
                ctx.ellipse(px, py, 4 + Math.random() * 4, 2 + Math.random() * 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 25; i++) {
                const px = Math.random() * TEXTURE_SIZE;
                const py = Math.random() * TEXTURE_SIZE;
                ctx.fillStyle = `rgba(95, 85, 70, ${0.4 + Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        function createRiverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, TEXTURE_SIZE, 0);
            gradient.addColorStop(0, '#2a5a80');
            gradient.addColorStop(0.5, '#3a6a95');
            gradient.addColorStop(1, '#2a5a80');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, TEXTURE_SIZE, TEXTURE_SIZE);

            for (let y = 0; y < TEXTURE_SIZE; y++) {
                for (let x = 0; x < TEXTURE_SIZE; x++) {
                    const n = fractalNoise(x / 25 + y * 0.02, y / 25, 3, 11);
                    if (n > 0.5) {
                        ctx.fillStyle = `rgba(80, 140, 180, ${(n - 0.5) * 0.6})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            ctx.strokeStyle = 'rgba(100, 160, 200, 0.35)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                const yBase = 10 + i * 25;
                ctx.moveTo(0, yBase);
                for (let x = 0; x <= TEXTURE_SIZE; x += 8) {
                    const flow = Math.sin(x / 12 + i * 0.5) * 4;
                    ctx.lineTo(x, yBase + flow);
                }
                ctx.stroke();
            }

            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = 'rgba(200, 230, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(Math.random() * TEXTURE_SIZE, Math.random() * TEXTURE_SIZE, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        // ===== UNIT SPRITE GENERATION =====

        function drawHumanSprite(ctx, cx, cy, size, playerColor, classType, isSelected, status = 'normal') {
            ctx.save();
            ctx.translate(cx, cy);

            const scale = size / 45;
            ctx.scale(scale, scale);

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 32, 18, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Selection glow
            if (isSelected) {
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 20;
            }

            // Class-specific colors
            let bodyColor, armorColor, helmetColor;
            switch (classType) {
                case 'scout':
                    bodyColor = '#2f3b2f'; armorColor = '#3e4a38'; helmetColor = '#4b5544';
                    break;
                case 'assault':
                    bodyColor = '#3b3a33'; armorColor = '#4b4a43'; helmetColor = '#595850';
                    break;
                case 'medic':
                    bodyColor = '#2d3a35'; armorColor = '#3d4a45'; helmetColor = '#4c5a55';
                    break;
                case 'sniper':
                    bodyColor = '#2a303a'; armorColor = '#353d4b'; helmetColor = '#404a59';
                    break;
                case 'ninja':
                    bodyColor = '#2b2b2b'; armorColor = '#383838'; helmetColor = '#454545';
                    break;
                default:
                    bodyColor = '#2f3b2f'; armorColor = '#3e4a38'; helmetColor = '#4b5544';
            }

            // Legs
            ctx.fillStyle = bodyColor;
            ctx.beginPath(); ctx.roundRect(-12, 8, 10, 22, 3); ctx.fill();
            ctx.beginPath(); ctx.roundRect(2, 8, 10, 22, 3); ctx.fill();
            applyCamoPattern(ctx, -12, 10, 24, 18, ['rgba(35, 45, 35, 0.5)', 'rgba(60, 70, 55, 0.4)', 'rgba(25, 30, 25, 0.4)'], 10);

            // Boots
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.roundRect(-13, 26, 12, 7, 2); ctx.fill();
            ctx.beginPath(); ctx.roundRect(1, 26, 12, 7, 2); ctx.fill();

            // Torso/Armor
            ctx.fillStyle = armorColor;
            ctx.beginPath(); ctx.roundRect(-16, -14, 32, 26, 5); ctx.fill();
            applyCamoPattern(ctx, -15, -12, 30, 22, ['rgba(45, 55, 45, 0.45)', 'rgba(70, 80, 60, 0.35)', 'rgba(30, 35, 30, 0.35)'], 14);

            // Player color stripe
            ctx.fillStyle = playerColor;
            ctx.fillRect(-16, -12, 4, 12);
            ctx.fillRect(12, -12, 4, 12);

            // Chest plate highlight
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath(); ctx.roundRect(-10, -12, 20, 10, 3); ctx.fill();

            // Arms
            ctx.fillStyle = bodyColor;
            ctx.beginPath(); ctx.roundRect(-24, -12, 10, 20, 3); ctx.fill();
            ctx.beginPath(); ctx.roundRect(14, -12, 10, 20, 3); ctx.fill();

            // Gloves
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.arc(-19, 10, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(19, 10, 6, 0, Math.PI * 2); ctx.fill();

            // Neck
            ctx.fillStyle = '#c9a07a';
            ctx.beginPath(); ctx.roundRect(-5, -20, 10, 8, 2); ctx.fill();

            // Head/Helmet
            ctx.fillStyle = helmetColor;
            ctx.beginPath(); ctx.arc(0, -28, 14, 0, Math.PI * 2); ctx.fill();

            // Visor
            const visorGradient = ctx.createLinearGradient(-10, -30, 10, -26);
            visorGradient.addColorStop(0, 'rgba(80, 180, 220, 0.8)');
            visorGradient.addColorStop(1, 'rgba(40, 120, 180, 0.6)');
            ctx.fillStyle = visorGradient;
            ctx.beginPath(); ctx.ellipse(0, -28, 11, 7, 0, 0, Math.PI); ctx.fill();

            // Helmet detail
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, -28, 14, 0, Math.PI * 2); ctx.stroke();

            // Class-specific equipment
            ctx.shadowBlur = 0;
            switch (classType) {
                case 'scout':
                    ctx.fillStyle = '#2a2a2a';
                    ctx.save(); ctx.rotate(-0.25); ctx.fillRect(-28, -38, 5, 50); ctx.restore();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath(); ctx.ellipse(-24, -35, 4, 4, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'assault':
                    ctx.fillStyle = '#2a2a2a';
                    ctx.beginPath(); ctx.roundRect(16, -4, 24, 8, 2); ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(36, -2, 10, 4);
                    ctx.fillStyle = armorColor;
                    ctx.beginPath(); ctx.ellipse(-20, -10, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(20, -10, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'medic':
                    ctx.fillStyle = '#3a4a3a';
                    ctx.beginPath(); ctx.roundRect(-22, -18, 12, 24, 4); ctx.fill();
                    ctx.fillStyle = '#cc3333';
                    ctx.fillRect(-19, -12, 6, 2);
                    ctx.fillRect(-17, -14, 2, 6);
                    ctx.fillStyle = '#aaaaaa';
                    ctx.beginPath(); ctx.roundRect(16, -2, 14, 5, 2); ctx.fill();
                    break;
                case 'sniper':
                    ctx.fillStyle = '#1a1a1a';
                    ctx.save(); ctx.rotate(-0.2); ctx.fillRect(-30, -42, 4, 60); ctx.restore();
                    ctx.fillStyle = '#3a3a55';
                    ctx.beginPath(); ctx.ellipse(-26, -38, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#6080ff';
                    ctx.beginPath(); ctx.arc(-26, -38, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#3a4a3a';
                    ctx.beginPath(); ctx.arc(0, -35, 8, Math.PI, 2 * Math.PI); ctx.fill();
                    ctx.fillStyle = '#2a3a2a';
                    ctx.fillRect(-8, -8, 3, 12);
                    ctx.fillRect(5, -8, 3, 12);
                    break;
                case 'ninja':
                    ctx.fillStyle = '#1f1f1f';
                    ctx.save(); ctx.rotate(-0.15); ctx.fillRect(10, -40, 5, 42); ctx.restore();
                    ctx.fillStyle = '#2f2f2f';
                    ctx.beginPath(); ctx.roundRect(16, -8, 20, 6, 2); ctx.fill();
                    ctx.fillStyle = '#606060';
                    ctx.fillRect(34, -6, 8, 2);
                    ctx.fillStyle = '#404040';
                    ctx.beginPath(); ctx.roundRect(-22, 2, 8, 16, 2); ctx.fill();
                    ctx.fillStyle = '#2a2a2a';
                    ctx.beginPath(); ctx.arc(0, -24, 10, 0.2 * Math.PI, 0.8 * Math.PI); ctx.fill();
                    ctx.fillStyle = '#a0a0a0';
                    ctx.beginPath(); ctx.arc(-6, -28, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(6, -28, 2, 0, Math.PI * 2); ctx.fill();
                    break;
            }

            // Status overlays
            if (status === 'attack') {
                ctx.save();
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = 'rgba(255, 200, 120, 0.8)';
                ctx.beginPath();
                ctx.moveTo(26, -6);
                ctx.lineTo(38, -2);
                ctx.lineTo(26, 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 220, 160, 0.7)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(20, -8);
                ctx.lineTo(34, -16);
                ctx.moveTo(20, 0);
                ctx.lineTo(34, 6);
                ctx.stroke();
                ctx.restore();
            }

            if (status === 'cover') {
                ctx.save();
                ctx.translate(0, 8);
                ctx.fillStyle = 'rgba(70, 80, 60, 0.9)';
                ctx.beginPath();
                ctx.roundRect(-22, 8, 44, 12, 4);
                ctx.fill();
                ctx.strokeStyle = 'rgba(40, 50, 35, 0.7)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-18, 10);
                ctx.lineTo(18, 10);
                ctx.moveTo(-12, 14);
                ctx.lineTo(12, 14);
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore();
        }

        function generateUnitSprite(classType, playerColor, isSelected = false, status = 'normal') {
            const padding = 20;
            const canvas = document.createElement('canvas');
            canvas.width = UNIT_SIZE + padding * 2;
            canvas.height = UNIT_SIZE + padding * 2;
            const ctx = canvas.getContext('2d');

            const cx = (UNIT_SIZE + padding * 2) / 2;
            const cy = (UNIT_SIZE + padding * 2) / 2;

            drawHumanSprite(ctx, cx, cy, UNIT_SIZE * 0.6, playerColor, classType, isSelected, status);

            return canvas;
        }

        // ===== TERRAIN DETAIL ELEMENTS =====

        function drawTree(ctx, cx, cy, size, treeType, seed) {
            ctx.save();

            // Ground shadow
            ctx.fillStyle = 'rgba(0, 20, 10, 0.5)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + size * 0.55, size * 0.5, size * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Trunk
            ctx.fillStyle = '#3d2817';
            const trunkWidth = size * 0.15;
            const trunkHeight = size * 0.5;
            ctx.fillRect(cx - trunkWidth / 2, cy, trunkWidth, trunkHeight);

            // Trunk detail
            ctx.strokeStyle = '#2a1a0f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - trunkWidth * 0.25, cy + size * 0.1);
            ctx.lineTo(cx - trunkWidth * 0.15, cy + trunkHeight * 0.8);
            ctx.stroke();

            if (treeType === 0) {
                // Pine tree
                const layers = 5;
                for (let i = layers - 1; i >= 0; i--) {
                    const layerY = cy - size * 0.05 - i * size * 0.18;
                    const layerWidth = size * (0.55 - i * 0.08);

                    ctx.fillStyle = `rgb(${15 + i * 7}, ${45 + i * 10}, ${25 + i * 5})`;
                    ctx.beginPath();
                    ctx.moveTo(cx, layerY - size * 0.28);
                    ctx.lineTo(cx - layerWidth, layerY + size * 0.12);
                    ctx.lineTo(cx + layerWidth, layerY + size * 0.12);
                    ctx.closePath();
                    ctx.fill();
                }
            } else if (treeType === 1) {
                // Round/deciduous tree
                const foliageColors = ['#1a4d2e', '#165a32', '#1e6b3a', '#2a7a45'];
                for (let i = 0; i < 4; i++) {
                    const fx = cx + (seededRandom(seed + i * 5) - 0.5) * size * 0.35;
                    const fy = cy - size * 0.3 + (seededRandom(seed + i * 5 + 1) - 0.5) * size * 0.25;
                    const fSize = size * (0.4 + seededRandom(seed + i * 5 + 2) * 0.2);

                    ctx.fillStyle = foliageColors[i % foliageColors.length];
                    ctx.beginPath();
                    ctx.arc(fx, fy, fSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (treeType === 2) {
                // Birch tree
                ctx.fillStyle = '#e8e4dc';
                ctx.fillRect(cx - trunkWidth / 2, cy, trunkWidth, trunkHeight);

                ctx.fillStyle = '#3a3530';
                for (let m = 0; m < 4; m++) {
                    const markY = cy + trunkHeight * (0.1 + m * 0.22);
                    const markWidth = trunkWidth * (0.4 + seededRandom(seed + m * 3) * 0.4);
                    ctx.fillRect(cx - markWidth / 2, markY, markWidth, 2);
                }

                const birchColors = ['#3d7a4a', '#4a8f58', '#5aa368', '#68b575'];
                for (let i = 0; i < 5; i++) {
                    const fx = cx + (seededRandom(seed + i * 7) - 0.5) * size * 0.5;
                    const fy = cy - size * 0.35 + (seededRandom(seed + i * 7 + 1) - 0.5) * size * 0.35;
                    const fSize = size * (0.25 + seededRandom(seed + i * 7 + 2) * 0.15);

                    ctx.fillStyle = birchColors[i % birchColors.length];
                    ctx.beginPath();
                    ctx.arc(fx, fy, fSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (treeType === 3) {
                // Willow tree - simplified
                ctx.fillStyle = '#4a3520';
                ctx.fillRect(cx - trunkWidth * 0.6, cy, trunkWidth * 1.2, trunkHeight * 0.8);

                ctx.strokeStyle = '#2d5a35';
                ctx.lineWidth = 2;
                for (let b = 0; b < 8; b++) {
                    const branchStartX = cx + (seededRandom(seed + b * 5) - 0.5) * size * 0.7;
                    const branchStartY = cy - size * 0.2;
                    const branchEndX = branchStartX + (seededRandom(seed + b * 5 + 1) - 0.5) * size * 0.4;
                    const branchEndY = cy + size * 0.3;

                    ctx.beginPath();
                    ctx.moveTo(branchStartX, branchStartY);
                    ctx.bezierCurveTo(branchStartX, branchStartY + size * 0.3, branchEndX, branchEndY - size * 0.2, branchEndX, branchEndY);
                    ctx.stroke();
                }
            } else {
                // Oak-style tree
                ctx.fillStyle = '#1a4d2e';
                ctx.beginPath();
                ctx.ellipse(cx, cy - size * 0.25, size * 0.55, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#165a32';
                ctx.beginPath();
                ctx.ellipse(cx - size * 0.18, cy - size * 0.38, size * 0.35, size * 0.28, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1e6b3a';
                ctx.beginPath();
                ctx.ellipse(cx + size * 0.15, cy - size * 0.42, size * 0.3, size * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Light highlight
            ctx.fillStyle = 'rgba(150, 200, 120, 0.2)';
            ctx.beginPath();
            ctx.ellipse(cx - size * 0.18, cy - size * 0.4, size * 0.18, size * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBush(ctx, cx, cy, size, seed) {
            ctx.save();

            // Shadow
            ctx.fillStyle = 'rgba(0, 30, 10, 0.4)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + size * 0.35, size * 0.6, size * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bush layers
            const layers = 4;
            for (let i = layers - 1; i >= 0; i--) {
                const layerSize = size * (0.5 + i * 0.18);
                const yOff = -i * size * 0.1;
                const shade = 0.55 + i * 0.12;
                ctx.fillStyle = `rgb(${Math.floor(30 * shade)}, ${Math.floor(70 * shade)}, ${Math.floor(35 * shade)})`;
                ctx.beginPath();
                ctx.ellipse(cx, cy + yOff, layerSize, layerSize * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Highlight
            ctx.fillStyle = 'rgba(100, 160, 80, 0.35)';
            ctx.beginPath();
            ctx.ellipse(cx - size * 0.18, cy - size * 0.2, size * 0.28, size * 0.22, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawRockFormation(ctx, cx, cy, size, seed) {
            ctx.save();

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.beginPath();
            ctx.ellipse(cx + 6, cy + size * 0.35, size * 0.75, size * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Main boulder
            ctx.fillStyle = '#4a4a5a';
            ctx.beginPath();
            ctx.moveTo(cx - size * 0.5, cy + size * 0.25);
            ctx.lineTo(cx - size * 0.55, cy - size * 0.1);
            ctx.lineTo(cx - size * 0.35, cy - size * 0.45);
            ctx.lineTo(cx + size * 0.1, cy - size * 0.55);
            ctx.lineTo(cx + size * 0.45, cy - size * 0.35);
            ctx.lineTo(cx + size * 0.5, cy + size * 0.05);
            ctx.lineTo(cx + size * 0.4, cy + size * 0.3);
            ctx.closePath();
            ctx.fill();

            // 3D shading
            const rockGradient = ctx.createLinearGradient(cx - size * 0.5, cy - size * 0.5, cx + size * 0.5, cy + size * 0.3);
            rockGradient.addColorStop(0, 'rgba(100, 100, 120, 0.6)');
            rockGradient.addColorStop(0.5, 'rgba(70, 70, 85, 0.3)');
            rockGradient.addColorStop(1, 'rgba(30, 30, 40, 0.5)');
            ctx.fillStyle = rockGradient;
            ctx.fill();

            // Smaller rock
            ctx.fillStyle = '#5a5a6a';
            ctx.beginPath();
            ctx.ellipse(cx - size * 0.25, cy + size * 0.2, size * 0.25, size * 0.15, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Cracks
            ctx.strokeStyle = 'rgba(30, 30, 40, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - size * 0.2, cy - size * 0.4);
            ctx.lineTo(cx - size * 0.15, cy - size * 0.1);
            ctx.stroke();

            // Highlights
            ctx.strokeStyle = 'rgba(150, 150, 170, 0.5)';
            ctx.beginPath();
            ctx.moveTo(cx - size * 0.35, cy - size * 0.45);
            ctx.lineTo(cx + size * 0.1, cy - size * 0.55);
            ctx.stroke();

            ctx.restore();
        }

        // ===== DOWNLOAD FUNCTIONS =====

        async function downloadAssets(assetList, folder) {
            // Create a zip file simulation by downloading individually
            for (const asset of assetList) {
                const link = document.createElement('a');
                link.download = `${folder}/${asset.name}`;
                link.href = asset.canvas.toDataURL('image/png');
                link.click();
                await new Promise(resolve => setTimeout(resolve, 100)); // Small delay between downloads
            }
        }

        // ===== GENERATION FUNCTIONS =====

        // Use enhanced generators by default
        let useEnhancedGenerators = true;

        window.generateTerrain = async function() {
            document.getElementById('btn-terrain').disabled = true;
            document.getElementById('terrain-preview').innerHTML = '';
            assets.terrain = [];
            resetRandomSeed();

            // Choose between enhanced and basic generators
            const generators = useEnhancedGenerators ? {
                grass: createEnhancedGrassTexture,
                forest: createEnhancedForestTexture,
                rock: createRockTexture,
                water: createEnhancedWaterTexture,
                sand: createSandTexture,
                swamp: createSwampTexture,
                hills: createHillsTexture,
                road: createRoadTexture,
                path: createPathTexture,
                river: createRiverTexture,
                wheat: createEnhancedWheatTexture,
                tallgrass: createEnhancedTallgrassTexture,
                reeds: createEnhancedReedsTexture
            } : {
                grass: createGrassTexture,
                forest: createForestTexture,
                rock: createRockTexture,
                water: createWaterTexture,
                sand: createSandTexture,
                swamp: createSwampTexture,
                hills: createHillsTexture,
                road: createRoadTexture,
                path: createPathTexture,
                river: createRiverTexture
            };

            // Animated terrain types (will generate frame sequences)
            const animatedTypes = ['water', 'wheat', 'tallgrass', 'reeds'];
            const animFrameCount = 4;

            const total = Object.keys(generators).length;
            let count = 0;

            // How many variants per terrain type
            const variants = 4;

            for (const [name, generator] of Object.entries(generators)) {
                // Base
                const baseCanvas = generator(0);
                assets.terrain.push({ name: `${name}.png`, canvas: baseCanvas });
                addPreview('terrain-preview', baseCanvas, `${name}.png`);
                count++;
                setProgress((count / total) * 100);
                log(`Generated terrain: ${name}.png`, 'success');
                await new Promise(resolve => setTimeout(resolve, 50));

                // Variants
                for (let v = 1; v <= variants; v++) {
                    const variantCanvas = generator(v);
                    const variantName = `${name}_v${v}.png`;
                    assets.terrain.push({ name: variantName, canvas: variantCanvas });
                    addPreview('terrain-preview', variantCanvas, variantName);
                    count++;
                    setProgress((count / total) * 100);
                    log(`Generated terrain variant: ${variantName}`, 'success');
                    await new Promise(resolve => setTimeout(resolve, 30));
                }

                // Animation frames for animated terrain types
                if (useEnhancedGenerators && animatedTypes.includes(name)) {
                    log(`Generating animation frames for ${name}...`, 'info');
                    for (let frame = 0; frame < animFrameCount; frame++) {
                        const frameCanvas = generator(0, frame); // variant 0, animation frame
                        const frameName = `${name}_f${frame}.png`;
                        assets.terrain.push({ name: frameName, canvas: frameCanvas });
                        addPreview('terrain-preview', frameCanvas, frameName);
                        log(`Generated animation frame: ${frameName}`, 'success');
                        await new Promise(resolve => setTimeout(resolve, 30));
                    }
                }
            }

            log(`Terrain generation complete! ${assets.terrain.length} textures`, 'success');
            document.getElementById('btn-terrain').disabled = false;
        };

        window.generateUnits = async function() {
            document.getElementById('btn-units').disabled = true;
            document.getElementById('units-preview').innerHTML = '';
            assets.units = [];
            resetRandomSeed();

            const total = UNIT_CLASSES.length * PLAYER_COLORS.length * 4;
            let count = 0;

            for (const classType of UNIT_CLASSES) {
                for (let playerIdx = 0; playerIdx < PLAYER_COLORS.length; playerIdx++) {
                    const playerColor = PLAYER_COLORS[playerIdx];

                    // Normal state
                    const normalCanvas = generateUnitSprite(classType, playerColor, false, 'normal');
                    const normalName = `${classType}_p${playerIdx}.png`;
                    assets.units.push({ name: normalName, canvas: normalCanvas });
                    addPreview('units-preview', normalCanvas, normalName);
                    count++;
                    setProgress((count / total) * 100);
                    log(`Generated unit: ${normalName}`, 'success');

                    // Selected state
                    const selectedCanvas = generateUnitSprite(classType, playerColor, true, 'selected');
                    const selectedName = `${classType}_p${playerIdx}_selected.png`;
                    assets.units.push({ name: selectedName, canvas: selectedCanvas });
                    addPreview('units-preview', selectedCanvas, selectedName);
                    count++;
                    setProgress((count / total) * 100);
                    log(`Generated unit: ${selectedName}`, 'success');

                    // Attack state
                    const attackCanvas = generateUnitSprite(classType, playerColor, false, 'attack');
                    const attackName = `${classType}_p${playerIdx}_attack.png`;
                    assets.units.push({ name: attackName, canvas: attackCanvas });
                    addPreview('units-preview', attackCanvas, attackName);
                    count++;
                    setProgress((count / total) * 100);
                    log(`Generated unit: ${attackName}`, 'success');

                    // Cover state
                    const coverCanvas = generateUnitSprite(classType, playerColor, false, 'cover');
                    const coverName = `${classType}_p${playerIdx}_cover.png`;
                    assets.units.push({ name: coverName, canvas: coverCanvas });
                    addPreview('units-preview', coverCanvas, coverName);
                    count++;
                    setProgress((count / total) * 100);
                    log(`Generated unit: ${coverName}`, 'success');

                    await new Promise(resolve => setTimeout(resolve, 20));
                }
            }

            log(`Unit generation complete! ${assets.units.length} sprites`, 'success');
            document.getElementById('btn-units').disabled = false;
        };

        window.generateDetails = async function() {
            document.getElementById('btn-details').disabled = true;
            document.getElementById('details-preview').innerHTML = '';
            assets.details = [];
            resetRandomSeed();

            // Generate trees
            const treeTypes = 5;
            const variants = 3;
            for (let type = 0; type < treeTypes; type++) {
                for (let v = 0; v < variants; v++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = DETAIL_SIZE;
                    canvas.height = DETAIL_SIZE;
                    const ctx = canvas.getContext('2d');
                    const seed = type * 100 + v * 10;

                    drawTree(ctx, DETAIL_SIZE / 2, DETAIL_SIZE / 2 + 20, DETAIL_SIZE * 0.35, type, seed);

                    const name = `tree_${type}_${v}.png`;
                    assets.details.push({ name, canvas });
                    addPreview('details-preview', canvas, name);
                    log(`Generated detail: ${name}`, 'success');
                    await new Promise(resolve => setTimeout(resolve, 20));
                }
            }

            // Generate bushes
            for (let v = 0; v < 4; v++) {
                const canvas = document.createElement('canvas');
                canvas.width = DETAIL_SIZE;
                canvas.height = DETAIL_SIZE;
                const ctx = canvas.getContext('2d');
                const seed = v * 123;

                drawBush(ctx, DETAIL_SIZE / 2, DETAIL_SIZE / 2, DETAIL_SIZE * 0.4, seed);

                const name = `bush_${v}.png`;
                assets.details.push({ name, canvas });
                addPreview('details-preview', canvas, name);
                log(`Generated detail: ${name}`, 'success');
                await new Promise(resolve => setTimeout(resolve, 20));
            }

            // Generate rocks
            for (let v = 0; v < 4; v++) {
                const canvas = document.createElement('canvas');
                canvas.width = DETAIL_SIZE;
                canvas.height = DETAIL_SIZE;
                const ctx = canvas.getContext('2d');
                const seed = v * 456;

                drawRockFormation(ctx, DETAIL_SIZE / 2, DETAIL_SIZE / 2, DETAIL_SIZE * 0.35, seed);

                const name = `rock_${v}.png`;
                assets.details.push({ name, canvas });
                addPreview('details-preview', canvas, name);
                log(`Generated detail: ${name}`, 'success');
                await new Promise(resolve => setTimeout(resolve, 20));
            }

            log(`Details generation complete! ${assets.details.length} elements`, 'success');
            document.getElementById('btn-details').disabled = false;
        };

        window.generateAll = async function() {
            document.getElementById('btn-all').disabled = true;
            log('Starting full asset generation...', 'info');
            resetRandomSeed();

            await generateTerrain();
            await generateUnits();
            await generateDetails();

            const totalAssets = assets.terrain.length + assets.units.length + assets.details.length;
            log(`\n🎉 All assets generated! Total: ${totalAssets} files`, 'success');
            log('Right-click on any preview to save individual assets, or use browser dev tools to export.', 'info');

            document.getElementById('btn-all').disabled = false;
        };
    </script>
