# Manual workflow for generating and updating game assets
name: Generate Assets

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name for the PR (default: update-assets-YYYYMMDD)'
        required: false
        type: string
      commit_message:
        description: 'Commit message for the asset update'
        required: false
        default: 'chore(assets): regenerate sprite sheets'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install main dependencies
        run: npm ci

      - name: Install asset generator dependencies
        run: npm ci
        working-directory: tools/asset-generator

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Generate assets
        run: node scripts/generate-assets.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet assets/spritesheets/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in assets"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in assets:"
            git diff --stat assets/spritesheets/
          fi

      - name: Set branch name
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          if [ -n "${{ inputs.branch_name }}" ]; then
            echo "name=${{ inputs.branch_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=update-assets-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "${{ inputs.commit_message || 'chore(assets): regenerate sprite sheets' }}"
          title: "chore(assets): Update generated sprite sheets"
          body: |
            ## Asset Update

            This PR was automatically generated by the **Generate Assets** workflow.

            ### Changes
            - Regenerated terrain textures
            - Regenerated tree sprites
            - Regenerated vegetation sprites (bushes, grass)
            - Regenerated character sprites

            ### Generated Files
            - `assets/spritesheets/terrain-hexes.png` + `.json`
            - `assets/spritesheets/trees.png` + `.json`
            - `assets/spritesheets/environment-details.png` + `.json`
            - `assets/spritesheets/unit-sprites.png` + `.json`

            ### Testing
            - [ ] Preview the game locally to verify assets render correctly
            - [ ] Check sprite alignment and colors
            - [ ] Verify all unit classes and terrain types are present

            ---
            *Triggered by: @${{ github.actor }}*
            *Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          labels: |
            assets
            automated
          draft: false

      - name: No changes summary
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "::notice::No changes detected in generated assets. The existing assets are up to date."
