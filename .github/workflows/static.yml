# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache-bust with git hash
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Version: $VERSION"
          sed -i "s/\?v=[^\"']*/\?v=$VERSION/g" index.html
      - name: Update version info display
        run: |
          VERSION=$(git rev-parse --short HEAD)
          BUILD_DATE=$(TZ='Europe/Berlin' date '+%d.%m.%Y %H:%M')
          echo "Build: $VERSION @ $BUILD_DATE"
          sed -i "s|Version DEV • Build: --|Version $VERSION • Build: $BUILD_DATE|g" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
