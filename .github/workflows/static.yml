# Workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy
  deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate static assets
        run: npm run build

      - name: Cache-bust with git hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Commit Hash: $COMMIT_HASH"
          sed -i "s/\?v=[^\"']*/\?v=$COMMIT_HASH/g" index.html

      - name: Update version info display
        run: |
          # Read version from package.json (managed by release-please)
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(TZ='Europe/Berlin' date '+%d.%m.%Y %H:%M')
          echo "Version: v$VERSION ($COMMIT_HASH) @ $BUILD_DATE"
          sed -i "s|Version DEV • Build: --|v$VERSION • $BUILD_DATE|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
