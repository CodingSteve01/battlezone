# Workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy
  deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Set build environment variables
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(TZ='Europe/Berlin' date '+%d.%m.%Y %H:%M')
          echo "VITE_APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "VITE_COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "Build info: v$VERSION ($COMMIT_HASH) @ $BUILD_DATE"

      - name: Build with Vite
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_BUILD_DATE: ${{ env.VITE_BUILD_DATE }}
          VITE_COMMIT_HASH: ${{ env.VITE_COMMIT_HASH }}

      - name: Update version info in built files
        run: |
          # Update version display in the built index.html
          sed -i "s|Version DEV • Build: --|$VITE_APP_VERSION • $VITE_BUILD_DATE|g" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
