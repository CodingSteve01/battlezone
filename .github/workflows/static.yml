# Workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Run CI checks before deployment
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  # Build and deploy after CI passes
  deploy:
    name: Build & Deploy
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate static assets
        run: npm run build

      - name: Cache-bust with git hash
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Version: $VERSION"
          sed -i "s/\?v=[^\"']*/\?v=$VERSION/g" index.html

      - name: Update version info display
        run: |
          VERSION=$(git rev-parse --short HEAD)
          BUILD_DATE=$(TZ='Europe/Berlin' date '+%d.%m.%Y %H:%M')
          echo "Build: $VERSION @ $BUILD_DATE"
          sed -i "s|Version DEV • Build: --|Version $VERSION • Build: $BUILD_DATE|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
