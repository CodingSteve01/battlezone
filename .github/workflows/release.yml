# Semantic Versioning with Release Please
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      #
      # GITHUB_TOKEN cannot be used here: GitHub refuses to start workflows for
      # anything it authors, so the release pull request arrives with no checks
      # and can never satisfy the Validate requirement on main. An App identity
      # is a different actor, and its pull request runs CI like any other.
      #
      # Optional on purpose. Until the App credentials exist the step is skipped
      # and release-please falls back to GITHUB_TOKEN, which is exactly today's
      # behaviour: releases keep working through the ruleset's admin bypass. The
      # moment RELEASE_APP_ID is set, the App takes over with no further change,
      # and the bypass can be removed.
      #
      # Set up with: bash scripts/setup-release-app.sh <app-id> <key.pem>
      #
      - name: Mint a release token
        id: app_token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Create release archive
        run: |
          archive_name="shadow-squad-${{ needs.release-please.outputs.version }}.zip"
          zip -r "${archive_name}" . \
            -x ".git/*" \
            -x "node_modules/*"
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"

      - name: Log release info
        run: |
          echo "New release created!"
          echo "Tag: ${{ needs.release-please.outputs.tag_name }}"
          echo "Version: ${{ needs.release-please.outputs.version }}"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${ARCHIVE_NAME}" --clobber
