<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #333; font-family: Arial, sans-serif; }
  canvas { display: block; }
  .game-container { display: flex; flex-wrap: nowrap; width: 100vw; height: 100vh; }
  .player-screen { position: relative; width: 50%; height: 100vh; background: #222; }
  .ui {
    position: absolute; 
    color: white; 
    padding: 10px; 
    z-index: 10;
  }
  .stats { 
    background: rgba(0,0,0,0.7); 
    border-radius: 5px; 
    padding: 10px; 
    margin-bottom: 10px; 
    font-size: 14px;
    line-height: 1.5;
  }
  .message { 
    position: absolute;
    bottom: 60px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: rgba(0,0,0,0.7); 
    padding: 10px 20px; 
    border-radius: 5px; 
    display: none; 
    font-size: 14px;
  }
  .minimap1, .minimap2 {
    position: absolute;
    width: 150px;
    height: 150px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid #fff;
    border-radius: 5px;
    z-index: 10;
  }
  .minimap1 {
    bottom: 10px;
    left: 10px;
  }
  .minimap2 {
    bottom: 10px;
    right: 10px;
  }
  .mode-display {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 5px;
    color: white;
    z-index: 10;
    cursor: pointer;
    font-size: 16px;
  }
  /* Start- und Game Over Bildschirme */
  .screen-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.8);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    font-family: Arial, sans-serif;
  }
  .screen-overlay.hidden {
    display: none;
  }
  .screen-overlay h1 {
    margin-bottom: 30px;
    font-size: 48px;
  }
  .screen-overlay button {
    padding: 15px 30px;
    margin: 10px;
    font-size: 20px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: #444;
    color: white;
    transition: background 0.3s;
  }
  .screen-overlay button:hover {
    background: #666;
  }
  /* Explosion Effekt */
  .explosion {
    position: absolute;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, rgba(255,165,0,1) 0%, rgba(255,0,0,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 1s forwards;
    z-index: 30;
  }
  @keyframes explode {
    from { transform: scale(0.5); opacity: 1; }
    to { transform: scale(2); opacity: 0; }
  }
  /* Wave Anzeige */
  .wave-display {
    margin-top: 10px;
    font-size: 16px;
  }
  /* Weitere UI Elemente */
  .achievement {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 10px 20px;
    border-radius: 5px;
    color: white;
    z-index: 10;
    font-size: 14px;
  }
</style>
</head>
<body>
<!-- Startbildschirm -->
<div class="screen-overlay" id="startScreen">
  <h1>Fahrzeugkampf-Spiel</h1>
  <button id="cooperativeBtn">Kooperativ</button>
  <button id="versusBtn">Versus</button>
</div>

<!-- Game Over Bildschirm -->
<div class="screen-overlay hidden" id="gameOverScreen">
  <h1>Spiel vorbei!</h1>
  <p id="gameOverMessage">Du bist gestorben.</p>
  <button id="restartBtn">Neustarten</button>
</div>

<div class="game-container" id="gameContainer" style="display: none;">
  <div class="player-screen">
    <canvas id="canvas1"></canvas>
    <div class="ui">
      <div class="stats">
        <strong>Player 1</strong><br>
        HP: <span id="health1">100</span><br>
        Ammo: <span id="ammo1">30</span><br>
        Weapon: <span id="weapon1">Pistole</span><br>
        Vehicle: <span id="vehicle1">None</span><br>
        Position: (<span id="posX1">0</span>, <span id="posY1">0</span>)
      </div>
      <div class="message" id="message1"></div>
      <canvas class="minimap1" id="minimap1"></canvas>
    </div>
  </div>
  <div class="player-screen">
    <canvas id="canvas2"></canvas>
    <div class="ui">
      <div class="stats">
        <strong>Player 2</strong><br>
        HP: <span id="health2">100</span><br>
        Ammo: <span id="ammo2">30</span><br>
        Weapon: <span id="weapon2">Pistole</span><br>
        Vehicle: <span id="vehicle2">None</span><br>
        Position: (<span id="posX2">0</span>, <span id="posY2">0</span>)
      </div>
      <div class="message" id="message2"></div>
      <canvas class="minimap2" id="minimap2"></canvas>
    </div>
  </div>
</div>
<div class="mode-display" id="modeDisplay">Mode: Kooperativ</div>

<!-- Wave Anzeige -->
<div class="wave-display" id="waveDisplay" style="position: absolute; top: 10px; right: 10px; color: white; z-index: 10; font-size: 16px;">
  Wave: 1
</div>

<!-- Achievement Anzeige -->
<div class="achievement hidden" id="achievementDisplay"></div>

<script>
// Konstanten
const TILE_SIZE = 40;
const MAP_SIZE = 100;
const SCREEN_WIDTH = window.innerWidth / 2;
const SCREEN_HEIGHT = window.innerHeight;

// Hilfsfunktion für Kollisionserkennung
function isColliding(entity, map) {
  const tileX = Math.floor(entity.x / TILE_SIZE);
  const tileY = Math.floor(entity.y / TILE_SIZE);
  if (tileX < 0 || tileX >= MAP_SIZE || tileY < 0 || tileY >= MAP_SIZE) return true;
  return map[tileY][tileX] !== 0 && map[tileY][tileX] !== 4 && map[tileY][tileX] !== 5 && map[tileY][tileX] !== 1;
}

// Zusätzliche Hilfsfunktion für Fahrzeugkollisionen
function isVehicleColliding(vehicle, vehicles) {
  return vehicles.some(v => v !== vehicle && Math.hypot(v.x - vehicle.x, v.y - vehicle.y) < TILE_SIZE);
}

// Abstandsfunktion
function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Neue Hilfsfunktion für Sichtfeld (Kegel)
function isInSight(entity, target, angle, fov, range) {
  const dist = distance(entity, target);
  if (dist > range) return false;
  const angleToTarget = Math.atan2(target.y - entity.y, target.x - entity.x);
  let angleDifference = Math.abs(angle - angleToTarget);
  angleDifference = angleDifference > Math.PI ? 2 * Math.PI - angleDifference : angleDifference;
  return angleDifference < fov / 2;
}

// Sound Manager mit Web Audio API
class SoundManager {
  constructor() {
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    this.sounds = {};
    this.loadSounds();
  }

  loadSounds() {
    // Hier sollten tatsächliche Audiodateien geladen werden
    // Für dieses Beispiel werden einfache Töne generiert
    // Für bessere Sounds, kannst du Audiodateien laden und abspielen
    this.sounds.shoot = () => {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, this.audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + 0.1);
    };

    this.sounds.explosion = () => {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, this.audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + 0.5);
    };

    this.sounds.pickup = () => {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + 0.3);
    };
  }

  play(soundName) {
    if (this.sounds[soundName]) {
      this.sounds[soundName]();
    }
  }
}

class Entity {
  constructor(x, y, angle = 0) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = 0;
    this.turnSpeed = 0;
  }

  move(map) {
    const newAngle = this.angle + this.turnSpeed;
    const newX = this.x + Math.cos(newAngle) * this.speed;
    const newY = this.y + Math.sin(newAngle) * this.speed;

    // Temporäre Position für Kollisionserkennung
    const tempEntity = { x: newX, y: newY };
    if (!isColliding(tempEntity, map)) {
      this.angle = newAngle;
      this.x = newX;
      this.y = newY;
    } else {
      // Bei Kollision Geschwindigkeit abbremsen
      this.speed *= 0.5;
    }
  }
}

class Human extends Entity {
  constructor(x, y, color, isAI = false) {
    super(x, y);
    this.type = 'human';
    this.color = color;
    this.health = 100;
    this.ammo = 30;
    this.weapon = 'Pistole';
    this.maxSpeed = 3;
    this.vehicle = null;
    this.role = null;
    this.canShoot = true;
    this.isAI = isAI;
    this.patrolPoints = [];
    this.currentPatrolIndex = 0;
    this.state = 'patrol'; // patrol, engage, flee, investigate
  }

  update(controls, map, soundManager, game) {
    if (this.vehicle) {
      if (this.role === 'driver') {
        this.updateVehicleControls(controls, map, game);
      } else if (this.role === 'gunner') {
        this.updateGunnerControls(controls, game);
      }
    } else {
      if (this.isAI) {
        this.updateAI(map, soundManager, game);
      } else {
        this.updateHumanControls(controls, map);
      }
    }
  }

  updateHumanControls(controls, map) {
    if (controls.forward) this.speed = Math.min(this.maxSpeed, this.speed + 0.2);
    if (controls.backward) this.speed = Math.max(-this.maxSpeed / 2, this.speed - 0.2);
    if (!controls.forward && !controls.backward) this.speed *= 0.9;
    if (controls.left) this.angle -= 0.05;
    if (controls.right) this.angle += 0.05;
    this.move(map);
  }

  updateVehicleControls(controls, map, game) {
    const v = this.vehicle;
    if (controls.forward) v.speed = Math.min(v.maxSpeed, v.speed + v.acceleration);
    if (controls.backward) v.speed = Math.max(-v.maxSpeed / 2, v.speed - v.acceleration);
    if (!controls.forward && !controls.backward) v.speed *= v.friction;
    if (controls.left) v.turnSpeed = -v.turnRate;
    if (controls.right) v.turnSpeed = v.turnRate;
    if (!controls.left && !controls.right) v.turnSpeed = 0;
    v.move(map);

    // Fahrzeugkollisionen überprüfen
    if (isVehicleColliding(v, v.game.vehicles)) {
      // Rückgängig machen der letzten Bewegung bei Kollision
      v.x -= Math.cos(v.angle) * v.speed;
      v.y -= Math.sin(v.angle) * v.speed;
      v.speed = 0;
    }
  }

  updateGunnerControls(controls, game) {
    const v = this.vehicle;
    if (controls.left) v.turretAngle = Math.max(-Math.PI / 2, v.turretAngle - 0.05);
    if (controls.right) v.turretAngle = Math.min(Math.PI / 2, v.turretAngle + 0.05);
  }

  updateAI(map, soundManager, game) {
    switch(this.state) {
      case 'patrol':
        this.patrol(map);
        break;
      case 'engage':
        this.engage(game);
        break;
      case 'flee':
        this.flee(game);
        break;
      case 'investigate':
        this.investigate(game);
        break;
      default:
        this.patrol(map);
    }
  }

  patrol(map) {
    if (this.patrolPoints.length === 0) {
      // Definiere zufällige Patrouillenpunkte
      for(let i = 0; i < 3; i++) {
        this.patrolPoints.push({
          x: Math.random() * MAP_SIZE * TILE_SIZE,
          y: Math.random() * MAP_SIZE * TILE_SIZE
        });
      }
    }

    const target = this.patrolPoints[this.currentPatrolIndex];
    const angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
    const dist = distance(this, target);

    if (dist < 50) {
      this.currentPatrolIndex = (this.currentPatrolIndex + 1) % this.patrolPoints.length;
    } else {
      this.angle = angleToTarget;
      this.speed = this.maxSpeed * 0.5;
      this.move(map);
    }
  }

  engage(game) {
    // Implementiere Kampflogik gegen Spieler oder Fahrzeuge
    // Beispiel: Schießen auf den nächsten Spieler
    const target = game.players[0]; // Einfachheitshalber
    const angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
    this.angle = angleToTarget;
    this.speed = 0;
    if (distance(this, target) < 300 && this.ammo > 0 && isInSight(this, target, this.angle, Math.PI / 2, 300)) {
      // Schießen
      game.bullets.push({
        x: this.x + Math.cos(this.angle) * 15,
        y: this.y + Math.sin(this.angle) * 15,
        angle: this.angle,
        speed: 15,
        damage: 10,
        owner: 'AI',
        vehicle: this.vehicle
      });
      this.ammo--;
      game.soundManager.play('shoot');
    }
  }

  flee(game) {
    // Implementiere Fluchtlogik
    this.speed = this.maxSpeed * 0.7;
    this.angle += Math.PI; // Einfach rückwärts bewegen
    this.move(game.map);
  }

  investigate(game) {
    // Implementiere Untersuchungslogik
    this.speed = 0;
    // Wechsel zurück zu Patrouille
    this.state = 'patrol';
  }
}

class Vehicle extends Entity {
  constructor(x, y, type) {
    super(x, y);
    this.type = type;
    this.health = 200;
    this.weapon = type === 'tank' || type === 'schuetzenpanzer' ? 'Maschinengewehr' : 'Kanone';
    this.ammo = type === 'tank' ? 20 : type === 'schuetzenpanzer' ? 30 : 50;
    this.driver = null;
    this.gunner = null;
    this.turretAngle = 0;
    this.game = null;

    // Fahrzeug-spezifische Eigenschaften
    switch(type) {
      case 'tank':
        this.maxSpeed = 2;
        this.acceleration = 0.1;
        this.turnRate = 0.02;
        this.friction = 0.95;
        this.color = '#556677';
        this.weaponOffset = 25;
        break;
      case 'jeep':
        this.maxSpeed = 4;
        this.acceleration = 0.2;
        this.turnRate = 0.04;
        this.friction = 0.92;
        this.color = '#887766';
        this.weaponOffset = 20;
        break;
      case 'lkw':
        this.maxSpeed = 3;
        this.acceleration = 0.15;
        this.turnRate = 0.03;
        this.friction = 0.93;
        this.color = '#666666';
        this.weaponOffset = 30;
        break;
      case 'schuetzenpanzer':
        this.maxSpeed = 3;
        this.acceleration = 0.15;
        this.turnRate = 0.03;
        this.friction = 0.93;
        this.color = '#ff8800';
        this.weaponOffset = 30;
        break;
      default:
        this.maxSpeed = 3;
        this.acceleration = 0.15;
        this.turnRate = 0.03;
        this.friction = 0.93;
        this.color = '#888888';
        this.weaponOffset = 25;
    }
  }

  update(map) {
    if (this.driver) {
      this.move(map);
      // Position der Insassen aktualisieren
      if (this.driver) {
        this.driver.x = this.x;
        this.driver.y = this.y;
      }
      if (this.gunner) {
        this.gunner.x = this.x;
        this.gunner.y = this.y;
      }
    }
  }
}

class Game {
  constructor(mode) {
    this.mode = mode; // 'Cooperative' oder 'Versus'
    this.soundManager = new SoundManager();
    this.setupCanvases();
    this.initGame();
    this.setupControls();
    this.setupModeDisplay();
    this.gameOver = false;
    this.gameLoopRunning = false;
    this.wave = 1;
    this.kisPerWave = 10;
    this.kisToSpawn = this.kisPerWave;
    this.maxWaves = 10;
    this.maxKis = 50; // Reduzierte maximale Anzahl der KI-Gegner zur Performance-Optimierung
    this.achievements = { kills: 0, vehiclesDestroyed: 0 };
    this.gameLoop();
  }

  setupCanvases() {
    this.canvas1 = document.getElementById('canvas1');
    this.canvas2 = document.getElementById('canvas2');
    this.ctx1 = this.canvas1.getContext('2d');
    this.ctx2 = this.canvas2.getContext('2d');
    this.canvas1.width = this.canvas2.width = SCREEN_WIDTH;
    this.canvas1.height = this.canvas2.height = SCREEN_HEIGHT;

    // Minikarten einrichten
    this.minimap1 = document.getElementById('minimap1');
    this.minimap2 = document.getElementById('minimap2');
    this.minimapCtx1 = this.minimap1.getContext('2d');
    this.minimapCtx2 = this.minimap2.getContext('2d');
    this.minimap1.width = this.minimap2.width = 150;
    this.minimap1.height = this.minimap2.height = 150;
  }

  setupModeDisplay() {
    const modeDisplay = document.getElementById('modeDisplay');
    modeDisplay.textContent = `Mode: ${this.mode}`;
    modeDisplay.style.display = 'block';
  }

  initGame() {
    this.map = this.generateLogicalMap();
    this.players = [
      new Human(100, 100, '#4444ff'),
      new Human(100, 100, '#ff4444')
    ];
    this.vehicles = this.generateVehicles();
    this.vehicles.forEach(v => v.game = this);
    this.bullets = [];
    this.powerUps = this.generatePowerUps();
    this.kis = [];
    this.generateEnemies();
    this.assignEnemyRoles();

    // Set initial positions based on mode
    if (this.mode === 'Cooperative') {
      this.players[1].x = this.players[0].x;
      this.players[1].y = this.players[0].y;
    } else {
      this.players[1].x = MAP_SIZE * TILE_SIZE - 100;
      this.players[1].y = MAP_SIZE * TILE_SIZE - 100;
    }

    // Sicherstellen, dass Spieler nicht auf Hindernissen spawnen
    this.players.forEach(player => {
      while (isColliding(player, this.map) || this.isPlayerOverlapping(player)) {
        player.x = Math.random() * MAP_SIZE * TILE_SIZE;
        player.y = Math.random() * MAP_SIZE * TILE_SIZE;
      }
    });

    // Update Wave Anzeige
    this.updateWaveDisplay();
  }

  resetGame() {
    this.gameOver = false;
    document.getElementById('gameOverScreen').classList.add('hidden');
    this.map = this.generateLogicalMap();
    this.players.forEach((player, index) => {
      player.health = 100;
      player.ammo = 30;
      player.weapon = 'Pistole';
      player.vehicle = null;
      player.role = null;
      player.canShoot = true;
      if (this.mode === 'Cooperative') {
        player.x = 100;
        player.y = 100;
      } else {
        player.x = index === 0 ? 100 : MAP_SIZE * TILE_SIZE - 100;
        player.y = index === 0 ? 100 : MAP_SIZE * TILE_SIZE - 100;
      }
      while (isColliding(player, this.map) || this.isPlayerOverlapping(player)) {
        player.x = Math.random() * MAP_SIZE * TILE_SIZE;
        player.y = Math.random() * MAP_SIZE * TILE_SIZE;
      }
      document.getElementById(`health${index+1}`).textContent = player.health;
      document.getElementById(`ammo${index+1}`).textContent = player.ammo;
      document.getElementById(`weapon${index+1}`).textContent = player.weapon;
      document.getElementById(`vehicle${index+1}`).textContent = 'None';
      document.getElementById(`posX${index+1}`).textContent = Math.round(player.x);
      document.getElementById(`posY${index+1}`).textContent = Math.round(player.y);
    });
    this.vehicles = this.generateVehicles();
    this.vehicles.forEach(v => v.game = this);
    this.bullets = [];
    this.powerUps = this.generatePowerUps();
    this.kis = [];
    this.generateEnemies();
    this.assignEnemyRoles();
    this.wave = 1;
    this.updateWaveDisplay();
  }

  isPlayerOverlapping(newPlayer) {
    return this.players.some(player => distance(player, newPlayer) < 50 && player !== newPlayer);
  }

  generateLogicalMap() {
    const map = [];
    // Initialisiere mit Gras (0)
    for(let y = 0; y < MAP_SIZE; y++) {
      const row = [];
      for(let x = 0; x < MAP_SIZE; x++) {
        row.push(0);
      }
      map.push(row);
    }

    // Generiere Straßen (Straßen sind Straßen-Tiles: 4)
    // Horizontale Straßen
    for(let y = 20; y < 80; y += 10) {
      for(let x = 10; x < 90; x++) {
        map[y][x] = 4;
      }
    }

    // Vertikale Straßen
    for(let x = 20; x < 80; x += 10) {
      for(let y = 10; y < 90; y++) {
        map[y][x] = 4;
      }
    }

    // Platzieren von Gebäuden (1 = Gebäude)
    for(let y = 15; y < 85; y += 10) {
      for(let x = 15; x < 85; x += 10) {
        if (map[y][x] !== 4 && map[y][x] !== 5) {
          const hasBuilding = Math.random() < 0.6; // 60% Wahrscheinlichkeit für ein Gebäude
          if (hasBuilding) {
            for(let dy = y; dy < y + 5; dy++) {
              for(let dx = x; dx < x + 5; dx++) {
                if (dx < MAP_SIZE && dy < MAP_SIZE) map[dy][dx] = 1;
              }
            }
          }
        }
      }
    }

    // Wasser hinzufügen (5 = Wasser)
    for(let y = 40; y < 60; y++) {
      for(let x = 40; x < 60; x++) {
        map[y][x] = 5;
      }
    }

    // Hindernisse (Bäume und Felsen)
    for(let y = 0; y < MAP_SIZE; y++) {
      for(let x = 0; x < MAP_SIZE; x++) {
        if (map[y][x] === 0) { // Nur auf Gras
          if (Math.random() < 0.02) map[y][x] = 2; // Bäume
          else if (Math.random() < 0.02) map[y][x] = 3; // Hindernisse
        }
      }
    }

    return map;
  }

  generateVehicles() {
    const vehicleTypes = ['tank', 'jeep', 'lkw', 'schuetzenpanzer'];
    const vehicles = [];
    for(let i = 0; i < 10; i++) {
      let x, y, type;
      do {
        x = Math.random() * MAP_SIZE * TILE_SIZE;
        y = Math.random() * MAP_SIZE * TILE_SIZE;
        type = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
      } while (isColliding({x, y}, this.map) || this.isVehiclePlacementInvalid(x, y) || this.isVehicleOverlapping(x, y, vehicles));
      const vehicle = new Vehicle(x, y, type);
      vehicles.push(vehicle);
    }
    return vehicles;
  }

  isVehiclePlacementInvalid(x, y) {
    const tileX = Math.floor(x / TILE_SIZE);
    const tileY = Math.floor(y / TILE_SIZE);
    if (tileX < 0 || tileX >= MAP_SIZE || tileY < 0 || tileY >= MAP_SIZE) return true;
    return this.map[tileY][tileX] === 4 || this.map[tileY][tileX] === 5 || this.map[tileY][tileX] === 1;
  }

  isVehicleOverlapping(x, y, vehiclesList) {
    return vehiclesList.some(vehicle => distance(vehicle, {x, y}) < TILE_SIZE);
  }

  generatePowerUps() {
    const powerUps = [];
    for(let i = 0; i < 40; i++) {
      let x, y, type;
      do {
        x = Math.random() * MAP_SIZE * TILE_SIZE;
        y = Math.random() * MAP_SIZE * TILE_SIZE;
        type = Math.random() < 0.5 ? 'health' : 'ammo';
      } while (isColliding({x, y}, this.map) || this.isPowerUpOverlapping(x, y, powerUps));
      powerUps.push({x, y, type});
    }
    return powerUps;
  }

  isPowerUpOverlapping(x, y, powerUpsList) {
    return powerUpsList.some(pu => distance(pu, {x, y}) < 50);
  }

  generateEnemies() {
    // Gegner logisch auf der Karte verteilen
    this.kis = [];
    // Gegner um Fahrzeuge platzieren
    this.vehicles.forEach(vehicle => {
      for(let i = 0; i < 2; i++) { // 2 Gegner pro Fahrzeug
        const angle = Math.random() * 2 * Math.PI;
        const dist = TILE_SIZE * 2;
        const x = vehicle.x + Math.cos(angle) * dist;
        const y = vehicle.y + Math.sin(angle) * dist;
        if (!isColliding({x, y}, this.map)) {
          this.kis.push(new Human(x, y, '#FFD700', true));
        }
      }
    });

    // Gegner um Gebäude platzieren
    for(let y = 15; y < 85; y += 10) {
      for(let x = 15; x < 85; x += 10) {
        if (this.map[y][x] === 1) { // Gebäude
          for(let i = 0; i < 3; i++) { // 3 Gegner pro Gebäude
            const angle = Math.random() * 2 * Math.PI;
            const dist = TILE_SIZE * 2;
            const posX = x * TILE_SIZE + Math.cos(angle) * dist;
            const posY = y * TILE_SIZE + Math.sin(angle) * dist;
            if (!isColliding({x: posX, y: posY}, this.map)) {
              this.kis.push(new Human(posX, posY, '#FFD700', true));
            }
          }
        }
      }
    }

    // Gegner auf Straßen patrouillieren
    for(let y = 20; y < 80; y += 10) {
      for(let x = 20; x < 80; x += 10) {
        if (this.map[y][x] === 4) { // Straße
          for(let i = 0; i < 2; i++) { // 2 Gegner pro Straßenabschnitt
            const posX = x * TILE_SIZE + Math.random() * TILE_SIZE;
            const posY = y * TILE_SIZE + Math.random() * TILE_SIZE;
            if (!isColliding({x: posX, y: posY}, this.map)) {
              this.kis.push(new Human(posX, posY, '#FFD700', true));
            }
          }
        }
      }
    }

    // Limit der Gesamtzahl der Gegner zur Performance-Optimierung
    this.kis = this.kis.slice(0, this.maxKis);
  }

  assignEnemyRoles() {
    // Weisen Sie den Gegnern spezifische Rollen zu, z.B. Bewacher oder Patrouillen
    this.kis.forEach(ki => {
      const rand = Math.random();
      if (rand < 0.5) {
        ki.state = 'patrol';
      } else {
        ki.state = 'engage';
      }
    });
  }

  spawnWave() {
    if (this.wave > this.maxWaves || this.kis.length >= this.maxKis) return;
    // Bei wave-basierten Systemen könnten zusätzliche Gegner hinzugefügt werden
    // Hier aber schon bei der Initialisierung verteilt
    this.updateWaveDisplay();
  }

  spawnWaveWithDelay() {
    if (this.wave < this.maxWaves && this.kis.length === 0) { // Max 10 Wellen und keine KI mehr vorhanden
      setTimeout(() => {
        this.generateEnemies();
        this.assignEnemyRoles();
        this.wave++;
        this.updateWaveDisplay();
      }, 5000); // 5 Sekunden Pause zwischen Wellen
    }
  }

  setupControls() {
    this.keys = {};
    this.controls = [
      { forward: 'ArrowUp', backward: 'ArrowDown', left: 'ArrowLeft', 
        right: 'ArrowRight', shoot: 'Space', action: 'Enter', switch: 'ShiftRight' },
      { forward: 'KeyW', backward: 'KeyS', left: 'KeyA', 
        right: 'KeyD', shoot: 'KeyF', action: 'KeyE', switch: 'KeyG' }
    ];
    
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','ShiftRight',
           'KeyW','KeyA','KeyS','KeyD','KeyF','KeyE','KeyG'].includes(e.code)) {
        e.preventDefault();
        this.keys[e.code] = true;
      }
    });
    
    window.addEventListener('keyup', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','ShiftRight',
           'KeyW','KeyA','KeyS','KeyD','KeyF','KeyE','KeyG'].includes(e.code)) {
        e.preventDefault();
        this.keys[e.code] = false;
      }
    });
  }

  getPlayerControls(index) {
    const keys = this.controls[index];
    return {
      forward: this.keys[keys.forward],
      backward: this.keys[keys.backward],
      left: this.keys[keys.left],
      right: this.keys[keys.right],
      shoot: this.keys[keys.shoot],
      action: this.keys[keys.action],
      switch: this.keys[keys.switch]
    };
  }

  handleVehicleInteraction(player, index) {
    const controls = this.getPlayerControls(index);
    if (controls.action) {
      if (player.vehicle) {
        // Aussteigen
        if (player.role === 'driver') player.vehicle.driver = null;
        else if (player.role === 'gunner') player.vehicle.gunner = null;
        player.vehicle = null;
        player.role = null;
        player.x += Math.cos(player.angle) * 30;
        player.y += Math.sin(player.angle) * 30;
        document.getElementById(`vehicle${index+1}`).textContent = 'None';
      } else {
        // Nächstes Fahrzeug betreten
        const nearestVehicle = this.vehicles.find(v => 
          distance(player, v) < 50 && (!v.driver || !v.gunner));
        if (nearestVehicle) {
          if (!nearestVehicle.driver) {
            nearestVehicle.driver = player;
            player.vehicle = nearestVehicle;
            player.role = 'driver';
            document.getElementById(`vehicle${index+1}`).textContent = nearestVehicle.type;
          } else if (!nearestVehicle.gunner) {
            nearestVehicle.gunner = player;
            player.vehicle = nearestVehicle;
            player.role = 'gunner';
            document.getElementById(`vehicle${index+1}`).textContent = nearestVehicle.type;
          }
        }
      }
    }
  }

  handleSwitchPosition(player, index) {
    const controls = this.getPlayerControls(index);
    if (controls.switch && player.vehicle) {
      const v = player.vehicle;
      if (player.role === 'driver' && !v.gunner) {
        v.driver = null;
        v.gunner = player;
        player.role = 'gunner';
      } else if (player.role === 'gunner' && !v.driver) {
        v.gunner = null;
        v.driver = player;
        player.role = 'driver';
      }
      // Update vehicle status in HUD
      document.getElementById(`vehicle${index+1}`).textContent = v.type;
    }
  }

  updatePlayer(player, index) {
    const controls = this.getPlayerControls(index);
    
    // Fahrzeuginteraktion
    if (controls.action) {
      this.handleVehicleInteraction(player, index);
      this.keys[this.controls[index].action] = false;
    }

    // Positionswechsel
    if (controls.switch) {
      this.handleSwitchPosition(player, index);
      this.keys[this.controls[index].switch] = false;
    }

    // Bewegung aktualisieren
    player.update(controls, this.map, this.soundManager, this);

    // Update Position in HUD
    document.getElementById(`posX${index+1}`).textContent = Math.round(player.x);
    document.getElementById(`posY${index+1}`).textContent = Math.round(player.y);

    // Schießen
    if (controls.shoot && player.ammo > 0 && player.canShoot &&
        (!player.vehicle || (player.vehicle && player.role === 'gunner'))) {
      const shootAngle = player.vehicle ? 
        player.vehicle.angle + player.vehicle.turretAngle : 
        player.angle;
      
      // Bestimmen der Schadenshöhe basierend auf Waffe
      let damage = 10; // Standard Schaden
      if (player.weapon === 'Schrotflinte') damage = 20;
      else if (player.weapon === 'Maschinengewehr') damage = 5;
      else if (player.weapon === 'Kanone') damage = 30;

      this.bullets.push({
        x: player.vehicle ? player.vehicle.x + Math.cos(shootAngle) * 30 : player.x + Math.cos(shootAngle) * 15,
        y: player.vehicle ? player.vehicle.y + Math.sin(shootAngle) * 30 : player.y + Math.sin(shootAngle) * 15,
        angle: shootAngle,
        speed: 15,
        damage: damage,
        owner: index,
        vehicle: player.vehicle
      });
      player.ammo--;
      document.getElementById(`ammo${index + 1}`).textContent = player.ammo;
      player.canShoot = false;

      // Sound abspielen
      this.soundManager.play('shoot');
    }

    // Reset canShoot Flag beim Loslassen der Schusstaste
    if (!controls.shoot && !player.canShoot) {
      player.canShoot = true;
    }
  }

  updateBullets() {
    for(let i = this.bullets.length -1; i >=0; i--){
      const bullet = this.bullets[i];
      bullet.x += Math.cos(bullet.angle) * bullet.speed;
      bullet.y += Math.sin(bullet.angle) * bullet.speed;
      
      // Kollision mit Karte
      const bulletEntity = { x: bullet.x, y: bullet.y };
      if (isColliding(bulletEntity, this.map)) {
        this.bullets.splice(i, 1);
        continue;
      }

      // Kollision mit Spielern
      this.players.forEach((player, j) => {
        if (bullet.owner !== j && distance(bullet, player) < 20) {
          if (this.mode === 'Cooperative' || (this.mode === 'Versus' && j !== bullet.owner)) {
            player.health -= bullet.damage;
            document.getElementById(`health${j + 1}`).textContent = Math.max(player.health, 0);
            this.bullets.splice(i, 1);
            // Explosion visuell darstellen
            this.createExplosion(player.x, player.y);
            this.soundManager.play('explosion');
            if (player.health <= 0) {
              this.achievements.kills++;
              if (this.mode === 'Versus') {
                this.endGame(`Player ${j + 1} wurde von Player ${bullet.owner + 1} getötet!`);
              } else {
                this.endGame(`Player ${j + 1} ist gestorben!`);
                this.spawnWaveWithDelay();
              }
              this.respawnPlayer(j);
            }
          }
        }
      });

      // Kollision mit KI-Gegnern (nur im Kooperativen Modus)
      if (this.mode === 'Cooperative') {
        for(let j = this.kis.length -1; j >=0; j--){
          const ki = this.kis[j];
          if (bullet.owner < this.players.length && distance(bullet, ki) < 20) { // Bullet from player
            ki.health -= bullet.damage;
            this.bullets.splice(i, 1);
            this.createExplosion(ki.x, ki.y);
            this.soundManager.play('explosion');
            if (ki.health <= 0) {
              this.kis.splice(j, 1);
              this.achievements.kills++;
            }
            break;
          }
        }
      }

      // Kollision mit Fahrzeugen
      this.vehicles.forEach((vehicle, j) => {
        let isOwnVehicle = false;
        if (bullet.vehicle && bullet.vehicle === vehicle) {
          isOwnVehicle = true;
        }
        if (!isOwnVehicle && distance(bullet, vehicle) < 30) {
          vehicle.health -= bullet.damage;
          this.bullets.splice(i, 1);
          this.createExplosion(vehicle.x, vehicle.y);
          this.soundManager.play('explosion');
          if (vehicle.health <= 0) {
            this.vehicles.splice(j, 1);
            this.achievements.vehiclesDestroyed++;
            // Entferne Fahrer und Gunners, falls vorhanden
            if (vehicle.driver) {
              vehicle.driver.vehicle = null;
              vehicle.driver.role = null;
              const driverIndex = this.players.indexOf(vehicle.driver);
              if (driverIndex !== -1) {
                document.getElementById(`vehicle${driverIndex +1}`).textContent = 'None';
              }
            }
            if (vehicle.gunner) {
              vehicle.gunner.vehicle = null;
              vehicle.gunner.role = null;
              const gunnerIndex = this.players.indexOf(vehicle.gunner);
              if (gunnerIndex !== -1) {
                document.getElementById(`vehicle${gunnerIndex +1}`).textContent = 'None';
              }
            }
          }
        }
      });

      // Kollision mit anderen Fahrzeugen (Überfahren)
      for(let j = 0; j < this.vehicles.length; j++) {
        for(let k = j + 1; k < this.vehicles.length; k++) {
          const vehicleA = this.vehicles[j];
          const vehicleB = this.vehicles[k];
          if (distance(vehicleA, vehicleB) < TILE_SIZE) {
            // Überfahrkollision: Schaden zufügen
            vehicleA.health -= 5;
            vehicleB.health -= 5;
            if (vehicleA.health <= 0) {
              this.vehicles.splice(j, 1);
              this.achievements.vehiclesDestroyed++;
              // Entferne Fahrer und Gunners, falls vorhanden
              if (vehicleA.driver) {
                vehicleA.driver.vehicle = null;
                vehicleA.driver.role = null;
                const driverIndex = this.players.indexOf(vehicleA.driver);
                if (driverIndex !== -1) {
                  document.getElementById(`vehicle${driverIndex +1}`).textContent = 'None';
                }
              }
              if (vehicleA.gunner) {
                vehicleA.gunner.vehicle = null;
                vehicleA.gunner.role = null;
                const gunnerIndex = this.players.indexOf(vehicleA.gunner);
                if (gunnerIndex !== -1) {
                  document.getElementById(`vehicle${gunnerIndex +1}`).textContent = 'None';
                }
              }
              k--;
            }
            if (vehicleB.health <= 0) {
              this.vehicles.splice(k, 1);
              this.achievements.vehiclesDestroyed++;
              // Entferne Fahrer und Gunners, falls vorhanden
              if (vehicleB.driver) {
                vehicleB.driver.vehicle = null;
                vehicleB.driver.role = null;
                const driverIndex = this.players.indexOf(vehicleB.driver);
                if (driverIndex !== -1) {
                  document.getElementById(`vehicle${driverIndex +1}`).textContent = 'None';
                }
              }
              if (vehicleB.gunner) {
                vehicleB.gunner.vehicle = null;
                vehicleB.gunner.role = null;
                const gunnerIndex = this.players.indexOf(vehicleB.gunner);
                if (gunnerIndex !== -1) {
                  document.getElementById(`vehicle${gunnerIndex +1}`).textContent = 'None';
                }
              }
            }
          }
        }
      }
    }}

    drawEntity(ctx, entity) {
      ctx.save();
      ctx.translate(entity.x, entity.y);
      ctx.rotate(entity.angle);
      
      if (entity instanceof Human && !entity.vehicle) {
        // Mensch zeichnen
        ctx.fillStyle = entity.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Waffe zeichnen
        ctx.fillStyle = '#000';
        ctx.fillRect(10, -2, 20, 4);
      } else if (entity instanceof Vehicle) {
        // Fahrzeugkörper zeichnen
        ctx.fillStyle = entity.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        switch(entity.type) {
          case 'tank':
            ctx.fillRect(-20, -15, 40, 30);
            break;
          case 'jeep':
            ctx.fillRect(-15, -10, 30, 20);
            break;
          case 'lkw':
            ctx.fillRect(-25, -15, 50, 30);
            break;
          case 'schuetzenpanzer':
            ctx.fillRect(-20, -15, 40, 30);
            break;
          default:
            ctx.fillRect(-20, -15, 40, 30);
        }
        ctx.stroke();

        // Turm zeichnen
        ctx.save();
        ctx.rotate(entity.turretAngle);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, -5, entity.weapon === 'Maschinengewehr' ? entity.weaponOffset * 1.5 : entity.weaponOffset, 10);
        ctx.restore();
      }
      
      // Lebensbalken zeichnen
      if (entity instanceof Human || entity instanceof Vehicle) {
        const maxBarWidth = 30;
        const barHeight = 4;
        const maxHealth = entity instanceof Vehicle ? 200 : 100;
        const healthRatio = entity.health / maxHealth;
        ctx.fillStyle = '#555';
        ctx.fillRect(-15, -25, maxBarWidth, barHeight);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-15, -25, maxBarWidth * healthRatio, barHeight);
      }
      
      ctx.restore();
    }

    drawMinimap(ctx, player) {
      ctx.clearRect(0, 0, 150, 150);
      const scale = 150 / (MAP_SIZE * TILE_SIZE);
      
      // Karte zeichnen
      for(let y = 0; y < MAP_SIZE; y++) {
        for(let x = 0; x < MAP_SIZE; x++) {
          if (this.map[y][x] === 1) ctx.fillStyle = '#888'; // Gebäude
          else if (this.map[y][x] === 2) ctx.fillStyle = '#355'; // Bäume
          else if (this.map[y][x] === 3) ctx.fillStyle = '#555'; // Hindernisse
          else if (this.map[y][x] === 4) ctx.fillStyle = '#999'; // Straße
          else if (this.map[y][x] === 5) ctx.fillStyle = '#00f'; // Wasser
          else ctx.fillStyle = '#5f5'; // Gras
          ctx.fillRect(x * TILE_SIZE * scale, y * TILE_SIZE * scale, TILE_SIZE * scale, TILE_SIZE * scale);
        }
      }

      // Power-Ups zeichnen
      this.powerUps.forEach(p => {
        ctx.fillStyle = p.type === 'health' ? '#f00' : '#00f';
        ctx.beginPath();
        ctx.arc(p.x * scale, p.y * scale, 2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Fahrzeuge zeichnen
      this.vehicles.forEach(v => {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(v.x * scale, v.y * scale, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Spieler zeichnen
      this.players.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x * scale, p.y * scale, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // KI-Gegner zeichnen (nur im Kooperativen Modus)
      if (this.mode === 'Cooperative') {
        this.kis.forEach(ki => {
          ctx.fillStyle = ki.color;
          ctx.beginPath();
          ctx.arc(ki.x * scale, ki.y * scale, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    drawGame(ctx, playerIndex) {
      const player = this.players[playerIndex];
      ctx.fillStyle = '#88aa88';
      ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

      ctx.save();
      // Kamera-Transformation basierend auf Spielerposition
      ctx.translate(SCREEN_WIDTH / 2 - player.x, SCREEN_HEIGHT / 2 - player.y);

      // Karte zeichnen
      this.map.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell === 1) {
            ctx.fillStyle = '#888';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else if (cell === 2) {
            ctx.fillStyle = '#355';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else if (cell === 3) {
            ctx.fillStyle = '#555';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else if (cell === 4) {
            ctx.fillStyle = '#999';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else if (cell === 5) {
            ctx.fillStyle = '#00f';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else {
            ctx.fillStyle = '#5f5';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        });
      });

      // Power-Ups zeichnen
      this.powerUps.forEach(p => {
        ctx.fillStyle = p.type === 'health' ? '#ff8888' : '#8888ff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // Fahrzeuge zeichnen
      this.vehicles.forEach(v => {
        this.drawEntity(ctx, v);
      });

      // Kugeln zeichnen
      this.bullets.forEach(b => {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Spieler zeichnen
      this.players.forEach(p => {
        if (p.vehicle) {
          this.drawEntity(ctx, p.vehicle);
        } else {
          this.drawEntity(ctx, p);
        }
      });

      // KI-Gegner zeichnen (nur im Kooperativen Modus)
      if (this.mode === 'Cooperative') {
        this.kis.forEach(ki => {
          if (ki.vehicle) {
            this.drawEntity(ctx, ki.vehicle);
          } else {
            this.drawEntity(ctx, ki);
          }
          // Sichtfeld der KI zeichnen (optional)
          ctx.save();
          ctx.translate(ki.x, ki.y);
          ctx.rotate(ki.angle);
          ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 150, -Math.PI / 4, Math.PI / 4);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });
      }

      // Interaktionsnachrichten anzeigen
      this.players.forEach((p, i) => {
        if (i === playerIndex) {
          let message = '';
          if (this.mode === 'Cooperative') {
            const nearestVehicle = this.vehicles.find(v => 
              distance(p, v) < 50 && (!v.driver || !v.gunner));
            if (nearestVehicle && !p.vehicle) {
              message = `Drücke ${this.controls[i].action} zum Einsteigen`;
              document.getElementById(`message${i+1}`).style.display = 'block';
              document.getElementById(`message${i+1}`).textContent = message;
            } else if (p.vehicle) {
              message = `Drücke ${this.controls[i].action} zum Aussteigen`;
              document.getElementById(`message${i+1}`).style.display = 'block';
              document.getElementById(`message${i+1}`).textContent = message;
            } else {
              document.getElementById(`message${i+1}`).style.display = 'none';
            }
          } else if (this.mode === 'Versus') {
            document.getElementById(`message${i+1}`).style.display = 'none';
          }
        }
      });

      ctx.restore();

      // Minikarte zeichnen
      if (playerIndex === 0) {
        this.drawMinimap(this.minimapCtx1, player);
      } else {
        this.drawMinimap(this.minimapCtx2, player);
      }

      // Wave Anzeige aktualisieren
      this.updateWaveDisplay();
    }

    updateWaveDisplay() {
      document.getElementById('waveDisplay').textContent = `Wave: ${this.wave}`;
    }

    checkPowerUpCollisions() {
      this.players.forEach((player, i) => {
        this.powerUps.forEach((powerUp, index) => {
          if (distance(player, powerUp) < 20) {
            if (powerUp.type === 'health') {
              player.health = Math.min(100, player.health + 25);
            } else {
              player.ammo += 20;
            }
            this.powerUps.splice(index, 1);
            // Sound abspielen
            this.soundManager.play('pickup');
            // Update HUD
            document.getElementById(`health${i+1}`).textContent = player.health;
            document.getElementById(`ammo${i+1}`).textContent = player.ammo;
            // Power-Up nach 10 Sekunden neu spawnen
            setTimeout(() => {
              let x, y, type;
              do {
                x = Math.random() * MAP_SIZE * TILE_SIZE;
                y = Math.random() * MAP_SIZE * TILE_SIZE;
                type = Math.random() < 0.5 ? 'health' : 'ammo';
              } while (isColliding({x, y}, this.map) || this.isPowerUpOverlapping(x, y, this.powerUps));
              this.powerUps.push({
                x: x,
                y: y,
                type: type
              });
            }, 10000);
          }
        });
      });

      // Power-Ups für KI-Gegner (nur im Kooperativen Modus)
      if (this.mode === 'Cooperative') {
        this.kis.forEach((ki, j) => {
          this.powerUps.forEach((powerUp, index) => {
            if (distance(ki, powerUp) < 20) {
              if (powerUp.type === 'health') {
                ki.health = Math.min(100, ki.health + 25);
              } else {
                ki.ammo += 20;
              }
              this.powerUps.splice(index, 1);
              this.soundManager.play('pickup');
              // Power-Up nach 10 Sekunden neu spawnen
              setTimeout(() => {
                let x, y, type;
                do {
                  x = Math.random() * MAP_SIZE * TILE_SIZE;
                  y = Math.random() * MAP_SIZE * TILE_SIZE;
                  type = Math.random() < 0.5 ? 'health' : 'ammo';
                } while (isColliding({x, y}, this.map) || this.isPowerUpOverlapping(x, y, this.powerUps));
                this.powerUps.push({
                  x: x,
                  y: y,
                  type: type
                });
              }, 10000);
            }
          });
        });
      }
    }

    updateKIs() {
      this.kis.forEach(ki => {
        if (ki.health <= 0) return;
        // KI-Verhalten basierend auf ihrem Zustand
        ki.update(null, this.map, this.soundManager, this);
      });
    }

    gameLoop() {
      if (this.gameOver) return;
      if (this.gameLoopRunning) return;
      this.gameLoopRunning = true;

      const loop = () => {
        if (this.gameOver) return;

        // Spielzustand aktualisieren
        this.players.forEach((p, i) => this.updatePlayer(p, i));
        this.vehicles.forEach(v => v.update(this.map));
        this.updateBullets();
        this.checkPowerUpCollisions();
        if (this.mode === 'Cooperative') {
          this.updateKIs();
        }

        // UI aktualisieren
        this.players.forEach((p, i) => {
          document.getElementById(`health${i+1}`).textContent = Math.max(p.health, 0);
          document.getElementById(`ammo${i+1}`).textContent = p.ammo;
          document.getElementById(`weapon${i+1}`).textContent = p.weapon;
          document.getElementById(`vehicle${i+1}`).textContent = p.vehicle ? p.vehicle.type : 'None';
          document.getElementById(`posX${i+1}`).textContent = Math.round(p.x);
          document.getElementById(`posY${i+1}`).textContent = Math.round(p.y);
        });

        // Rendern
        this.ctx1.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        this.ctx2.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        this.drawGame(this.ctx1, 0);
        this.drawGame(this.ctx2, 1);

        // Wave Management
        if (this.mode === 'Cooperative' && this.kis.length === 0 && this.wave < this.maxWaves) {
          this.spawnWaveWithDelay();
        }

        requestAnimationFrame(loop);
      };

      loop();
    }

    endGame(message) {
      this.gameOver = true;
      const gameOverScreen = document.getElementById('gameOverScreen');
      const gameOverMessage = document.getElementById('gameOverMessage');
      gameOverMessage.textContent = `${message}\nKills: ${this.achievements.kills}, Vehicles Destroyed: ${this.achievements.vehiclesDestroyed}`;
      gameOverScreen.classList.remove('hidden');
    }

    respawnPlayer(index) {
      const player = this.players[index];
      player.health = 100;
      player.ammo = 30;
      player.weapon = 'Pistole';
      player.x = this.mode === 'Cooperative' ? 100 : (index === 0 ? 100 : MAP_SIZE * TILE_SIZE - 100);
      player.y = this.mode === 'Cooperative' ? 100 : (index === 0 ? 100 : MAP_SIZE * TILE_SIZE - 100);
      while (isColliding(player, this.map) || this.isPlayerOverlapping(player)) {
        player.x = Math.random() * MAP_SIZE * TILE_SIZE;
        player.y = Math.random() * MAP_SIZE * TILE_SIZE;
      }
      document.getElementById(`health${index+1}`).textContent = player.health;
      document.getElementById(`ammo${index+1}`).textContent = player.ammo;
      document.getElementById(`weapon${index+1}`).textContent = player.weapon;
      document.getElementById(`posX${index+1}`).textContent = Math.round(player.x);
      document.getElementById(`posY${index+1}`).textContent = Math.round(player.y);
    }

    createExplosion(x, y) {
      // Skalieren Sie die Explosionseffekt-Position entsprechend der Kamera
      const explosion = document.createElement('div');
      explosion.classList.add('explosion');
      // Umrechnung von Spielkoordinaten zu Bildschirmkoordinaten
      const screenX = x - (this.players[0].x - SCREEN_WIDTH / 2);
      const screenY = y - (this.players[0].y - SCREEN_HEIGHT / 2);
      explosion.style.left = `${screenX - 25}px`;
      explosion.style.top = `${screenY - 25}px`;
      document.body.appendChild(explosion);
      setTimeout(() => {
        explosion.remove();
      }, 1000);
    }
}

let game;

// Startbildschirm-Logik
document.getElementById('cooperativeBtn').addEventListener('click', () => {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameContainer').style.display = 'flex';
  game = new Game('Cooperative');
});

document.getElementById('versusBtn').addEventListener('click', () => {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameContainer').style.display = 'flex';
  game = new Game('Versus');
});

// Neustart-Button-Logik
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('gameContainer').style.display = 'flex';
  game.resetGame();
});

// Moduswechsel durch Klick auf Mode Display
document.getElementById('modeDisplay').addEventListener('click', () => {
  if (game && !game.gameOver) {
    game.mode = game.mode === 'Cooperative' ? 'Versus' : 'Cooperative';
    document.getElementById('modeDisplay').textContent = `Mode: ${game.mode}`;
    game.resetGame();
  }
});
</script>
