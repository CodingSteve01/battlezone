<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Isometric Game</title>
    <style>
        /* Previous styles remain unchanged */
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #minimap {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            display: none;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            font-size: 16px;
            text-shadow: 1px 1px 1px black;
            display: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            font-size: 24px;
            text-align: center;
        }

        #vehicle-select {
            position: absolute;
            top: 50px;
            left: 10px;
            color: white;
            font-family: Arial;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
        }

        #progress {
            width: 300px;
            height: 20px;
            background: #333;
            margin-top: 10px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #0f0;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div id="minimap"></div>
<div id="info">WASD to move, E to enter/exit vehicle, Space to jump, V to switch vehicles</div>
<div id="vehicle-select">Current Vehicle: Car</div>
<div id="loading">
    Loading Game...
    <div id="progress">
        <div id="progress-bar"></div>
    </div>
    <div id="loading-message"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
	// Utility class for game settings and constants
	class GameSettings {
		static get CAMERA_BASE_DISTANCE() {
			return 30;
		}

		static get CAMERA_MAX_ZOOM() {
			return 45;
		}

		static get CAMERA_MIN_ZOOM() {
			return 25;
		}

		static get CAMERA_ZOOM_SPEED() {
			return 0.1;
		}

		static get TREE_COUNT() {
			return 200;
		}

		static get WORLD_SIZE() {
			return 2000;
		}

		static get CHUNK_SIZE() {
			return 100;
		}
	}

	// Class to handle object pooling for performance
	class ObjectPool {
		constructor(createFunc, initialSize = 100) {
			this.createFunc = createFunc;
			this.pool = Array(initialSize).fill(null).map(() => createFunc());
			this.active = new Set();
		}

		acquire() {
			let object = this.pool.pop() || this.createFunc();
			this.active.add(object);
			return object;
		}

		release(object) {
			this.active.delete(object);
			this.pool.push(object);
		}
	}

	// Spatial hash grid for efficient collision detection
	class SpatialHashGrid {
		constructor(cellSize) {
			this.cellSize = cellSize;
			this.grid = new Map();
		}

		getKey(x, z) {
			const cx = Math.floor(x / this.cellSize);
			const cz = Math.floor(z / this.cellSize);
			return `${cx},${cz}`;
		}

		insert(object) {
			const key = this.getKey(object.position.x, object.position.z);
			if (!this.grid.has(key)) {
				this.grid.set(key, new Set());
			}
			this.grid.get(key).add(object);
		}

		query(x, z, radius) {
			const results = new Set();
			const minX = Math.floor((x - radius) / this.cellSize);
			const maxX = Math.floor((x + radius) / this.cellSize);
			const minZ = Math.floor((z - radius) / this.cellSize);
			const maxZ = Math.floor((z + radius) / this.cellSize);

			for (let ix = minX; ix <= maxX; ix++) {
				for (let iz = minZ; iz <= maxZ; iz++) {
					const key = `${ix},${iz}`;
					const cell = this.grid.get(key);
					if (cell) {
						cell.forEach(obj => results.add(obj));
					}
				}
			}
			return Array.from(results);
		}

		clear() {
			this.grid.clear();
		}
	}

	// Terrain generator class
	class TerrainGenerator {
		constructor() {
			this.roadNetwork = new Map();
			this.roadCache = new Map();
			this.cacheSize = 1000;
		}

		generateHeight(x, z) {
			const baseHeight = Math.sin(x / 30) * Math.cos(z / 30) * 3;

			// Check if point is near a road
			const roadDistance = this.getDistanceToNearestRoad(x, z);
			if (roadDistance < 5) {
				return 0; // Road level
			}

			return baseHeight;
		}

		generateRoads() {
			// Generate main road more efficiently
			const roadPoints = [];
			for (let x = -1000; x < 1000; x += 5) { // Increased step size
				roadPoints.push([x, 0]);
			}

			// Generate fewer branching roads
			for (let z = -1000; z < 1000; z += 400) { // Increased spacing
				for (let x = -100; x < 100; x += 5) { // Increased step size
					roadPoints.push([x, z]);
				}
			}

			// Store road points more efficiently
			roadPoints.forEach(([x, z]) => {
				const key = `${Math.floor(x / 10)},${Math.floor(z / 10)}`;
				this.roadNetwork.set(key, true);
			});
		}

		generateRoadsSegment(start, end) {
			// Generate main road segment
			for (let x = start; x < end; x += 5) {
				this.addRoadPoint(x, 0);
			}

			// Generate branch roads for this segment
			for (let z = -1000; z < 1000; z += 400) {
				if (z >= start && z < end) {
					for (let x = -100; x < 100; x += 5) {
						this.addRoadPoint(x, z);
					}
				}
			}
		}

		addRoadPoint(x, z) {
			const key = `${Math.floor(x / 10)},${Math.floor(z / 10)}`;
			this.roadNetwork.set(key, true);
		}

		getDistanceToNearestRoad(x, z) {
			// Check cache first
			const cacheKey = `${Math.floor(x)},${Math.floor(z)}`;
			if (this.roadCache.has(cacheKey)) {
				return this.roadCache.get(cacheKey);
			}

			// Simplified distance calculation
			const gridX = Math.floor(x / 10);
			const gridZ = Math.floor(z / 10);
			let minDist = Infinity;

			// Check only nearby grid cells
			for (let ix = -1; ix <= 1; ix++) {
				for (let iz = -1; iz <= 1; iz++) {
					const key = `${gridX + ix},${gridZ + iz}`;
					if (this.roadNetwork.has(key)) {
						const dist = Math.sqrt(ix * ix + iz * iz) * 10;
						minDist = Math.min(minDist, dist);
					}
				}
			}

			// Cache the result
			if (this.roadCache.size > this.cacheSize) {
				const firstKey = this.roadCache.keys().next().value;
				this.roadCache.delete(firstKey);
			}
			this.roadCache.set(cacheKey, minDist);

			return minDist;
		}

		getGroundType(x, z) {
			const roadDistance = this.getDistanceToNearestRoad(x, z);
			if (roadDistance < 5) {
				return 'road';
			}
			const height = this.generateHeight(x, z);
			if (height > 2) return 'mountain';
			if (height > 1) return 'hill';
			return 'grass';
		}
	}

	class LoadingManager {
		constructor() {
			this.progressBar = document.getElementById('progress-bar');
			this.loadingMessage = document.getElementById('loading-message');
			this.loadingContainer = document.getElementById('loading');
			this.minimap = document.getElementById('minimap');
			this.info = document.getElementById('info');

			// Ensure all elements exist
			if (!this.progressBar || !this.loadingMessage || !this.loadingContainer) {
				throw new Error('Required loading elements not found');
			}
		}

		updateProgress(progress, message) {
			this.progressBar.style.width = `${progress}%`;
			this.loadingMessage.textContent = message;
			return new Promise(resolve => setTimeout(resolve, 0));
		}

		hideLoading() {
			this.loadingContainer.style.display = 'none';
			this.minimap.style.display = 'block';
			this.info.style.display = 'block';
		}
	}

	// ChunkManager class for dynamic terrain loading
	class ChunkManager {
		constructor(scene, terrainGenerator, treePool) {
			this.scene = scene;
			this.terrainGenerator = terrainGenerator;
			this.treePool = treePool;
			this.chunks = new Map();
			this.chunkSize = GameSettings.CHUNK_SIZE;
			this.viewDistance = 3; // Number of chunks visible in each direction
			this.grassGeometry = new THREE.PlaneGeometry(1, 1);
			this.grassMaterial = new THREE.MeshStandardMaterial({
				color: 0x33aa33,
				transparent: true,
				alphaTest: 0.5
			});
			this.grassPool = new ObjectPool(() => this.createGrass(), 1000);
		}

		createGrass() {
			const grass = new THREE.Mesh(this.grassGeometry, this.grassMaterial);
			grass.rotation.x = -Math.PI / 2;
			return grass;
		}

		getChunkKey(x, z) {
			const chunkX = Math.floor(x / this.chunkSize);
			const chunkZ = Math.floor(z / this.chunkSize);
			return `${chunkX},${chunkZ}`;
		}

		updateChunks(cameraPosition) {
			const centerChunkX = Math.floor(cameraPosition.x / this.chunkSize);
			const centerChunkZ = Math.floor(cameraPosition.z / this.chunkSize);

			// Track which chunks should be kept
			const activeChunks = new Set();

			// Load visible chunks
			for (let x = -this.viewDistance; x <= this.viewDistance; x++) {
				for (let z = -this.viewDistance; z <= this.viewDistance; z++) {
					const chunkX = centerChunkX + x;
					const chunkZ = centerChunkZ + z;
					const key = `${chunkX},${chunkZ}`;
					activeChunks.add(key);

					if (!this.chunks.has(key)) {
						this.loadChunk(chunkX, chunkZ);
					}
				}
			}

			// Unload distant chunks
			for (const [key, chunk] of this.chunks) {
				if (!activeChunks.has(key)) {
					this.unloadChunk(key);
				}
			}
		}

		loadChunk(chunkX, chunkZ) {
			const key = `${chunkX},${chunkZ}`;
			const chunk = {
				terrain: this.createTerrainChunk(chunkX, chunkZ),
				grass: this.createGrassForChunk(chunkX, chunkZ),
				trees: this.createTreesForChunk(chunkX, chunkZ)
			};
			this.chunks.set(key, chunk);
		}

		unloadChunk(key) {
			const chunk = this.chunks.get(key);
			if (chunk) {
				this.scene.remove(chunk.terrain);
				chunk.grass.forEach(grass => {
					this.scene.remove(grass);
					this.grassPool.release(grass);
				});
				chunk.trees.forEach(tree => {
					this.scene.remove(tree);
					this.treePool.release(tree);
				});
				this.chunks.delete(key);
			}
		}

		createTerrainChunk(chunkX, chunkZ) {
			const geometry = new THREE.PlaneGeometry(
				this.chunkSize,
				this.chunkSize,
				20,
				20
			);

			const startX = chunkX * this.chunkSize;
			const startZ = chunkZ * this.chunkSize;

			const vertices = geometry.attributes.position.array;
			for (let i = 0; i < vertices.length; i += 3) {
				const x = startX + vertices[i];
				const z = startZ + vertices[i + 1];
				vertices[i + 2] = this.terrainGenerator.generateHeight(x, z);
			}

			geometry.computeVertexNormals();

			const material = new THREE.MeshStandardMaterial({
				color: 0x558822,
				roughness: 0.9
			});

			const mesh = new THREE.Mesh(geometry, material);
			mesh.rotation.x = -Math.PI / 2;
			mesh.position.set(
				startX + this.chunkSize / 2,
				0,
				startZ + this.chunkSize / 2
			);

			this.scene.add(mesh);
			return mesh;
		}

		createGrassForChunk(chunkX, chunkZ) {
			const grass = [];
			const grassCount = 1000; // Adjust based on performance
			const startX = chunkX * this.chunkSize;
			const startZ = chunkZ * this.chunkSize;

			for (let i = 0; i < grassCount; i++) {
				const x = startX + Math.random() * this.chunkSize;
				const z = startZ + Math.random() * this.chunkSize;

				// Don't place grass on roads
				if (this.terrainGenerator.getDistanceToNearestRoad(x, z) < 5) {
					continue;
				}

				const grassBlade = this.grassPool.acquire();
				const y = this.terrainGenerator.generateHeight(x, z);
				grassBlade.position.set(x, y, z);
				grassBlade.rotation.y = Math.random() * Math.PI;
				grassBlade.scale.set(0.5, Math.random() * 0.5 + 0.5, 0.5);
				this.scene.add(grassBlade);
				grass.push(grassBlade);
			}

			return grass;
		}

		createTreesForChunk(chunkX, chunkZ) {
			const trees = [];
			const treeCount = 20;
			const startX = chunkX * this.chunkSize;
			const startZ = chunkZ * this.chunkSize;

			for (let i = 0; i < treeCount; i++) {
				const x = startX + Math.random() * this.chunkSize;
				const z = startZ + Math.random() * this.chunkSize;

				if (this.terrainGenerator.getDistanceToNearestRoad(x, z) < 10) {
					continue;
				}

				const tree = this.treePool.acquire();  // Use the stored treePool
				const y = this.terrainGenerator.generateHeight(x, z);
				tree.position.set(x, y, z);
				this.scene.add(tree);
				trees.push(tree);
			}

			return trees;
		}
	}

	class VehiclePhysics {
		constructor(game, vehicle, terrain) {
			this.game = game;
			this.vehicle = vehicle;
			this.terrain = terrain;
			this.state = {
				velocity: new THREE.Vector3(),
				angularVelocity: 0,
				steeringAngle: 0,
				engineForce: 0,
				brakeForce: 0,
				wheelbase: 4,
				maxSteerAngle: Math.PI / 4,
				mass: 1000,
				drag: 0.3,
				maxSpeed: 20,
				rearWheelPosition: new THREE.Vector3(0, 0, -2),
				frontWheelPosition: new THREE.Vector3(0, 0, 2)
			};
		}

		update(deltaTime) {
			const state = this.state;
			const position = this.vehicle.position;

			// Calculate forces
			const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.vehicle.quaternion);

			// Apply engine force
			const engineForce = forward.clone().multiplyScalar(state.engineForce * 20000);
			const dragForce = state.velocity.clone().multiplyScalar(-state.drag * state.velocity.length());
			const totalForce = engineForce.add(dragForce);

			// Calculate acceleration
			const acceleration = totalForce.divideScalar(state.mass);

			// Update velocity
			state.velocity.add(acceleration.multiplyScalar(deltaTime));

			// Apply steering using bicycle model
			if (state.velocity.length() > 0.1) {
				const steeringAngle = state.steeringAngle;
				const wheelbase = state.wheelbase;

				if (Math.abs(steeringAngle) > 0.001) {
					const turningRadius = wheelbase / Math.sin(Math.abs(steeringAngle));
					const angularVelocity = (state.velocity.length() / turningRadius) * Math.sign(steeringAngle);

					// Apply rotation around rear axle
					this.vehicle.position.sub(state.rearWheelPosition);
					this.vehicle.rotateY(angularVelocity * deltaTime);
					this.vehicle.position.add(state.rearWheelPosition);

					// Update forward direction after rotation
					forward.set(0, 0, 1).applyQuaternion(this.vehicle.quaternion);
				}
			}

			// Update position
			const movement = state.velocity.clone().multiplyScalar(deltaTime);
			const newPosition = position.clone().add(movement);

			// Ground height and collision detection
			const groundHeight = this.terrain.generateHeight(newPosition.x, newPosition.z);
			newPosition.y = groundHeight + 1.0;

			// Update vehicle position if no collision
			if (!this.checkCollisions(newPosition)) {
				this.vehicle.position.copy(newPosition);

				// Update wheel visuals
				if (this.vehicle.userData.wheels) {
					const wheels = this.vehicle.userData.wheels;
					wheels.frontLeft.rotation.y = state.steeringAngle;
					wheels.frontRight.rotation.y = state.steeringAngle;

					// Rotate wheels based on speed
					const wheelRotationSpeed = state.velocity.length() * 2;
					Object.values(wheels).forEach(wheel => {
						if (wheel instanceof THREE.Mesh) {
							wheel.rotation.x += wheelRotationSpeed * deltaTime;
						} else if (wheel instanceof THREE.Group) {
							wheel.children[0].rotation.x += wheelRotationSpeed * deltaTime;
						}
					});
				}
			} else {
				state.velocity.multiplyScalar(-0.5);
			}
		}

		checkCollisions(position) {
			// Check terrain slope
			const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.vehicle.quaternion);
			const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.vehicle.quaternion);

			const forwardPoint = this.terrain.generateHeight(
				position.x + forward.x * 2,
				position.z + forward.z * 2
			);
			const backwardPoint = this.terrain.generateHeight(
				position.x - forward.x * 2,
				position.z - forward.z * 2
			);

			const slope = Math.abs(forwardPoint - backwardPoint) / 4;
			if (slope > 0.5) { // Max slope threshold
				return true;
			}

			// Check tree collisions
			const nearbyObjects = this.game.spatialHash.query(
				position.x,
				position.z,
				5
			);

			for (const obj of nearbyObjects) {
				if (obj.userData.collider) {
					const distance = position.distanceTo(obj.position);
					if (distance < 3) { // Simple radius check
						return true;
					}
				}
			}

			return false;
		}
	}

	// VehicleFactory class to create different vehicle types
	class VehicleFactory {
		static createVehicle(type, position) {
			switch (type.toLowerCase()) {
				case 'car':
					return this.createCar(position);
				case 'truck':
					return this.createTruck(position);
				case 'motorcycle':
					return this.createMotorcycle(position);
				default:
					return this.createCar(position);
			}
		}

		static createCar(position) {
			const group = new THREE.Group();

			// Enhanced car body
			const bodyGeometry = new THREE.BoxGeometry(2, 1.2, 4.5);
			const bodyMaterial = new THREE.MeshStandardMaterial({
				color: 0xff0000,
				metalness: 0.6,
				roughness: 0.4
			});
			const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
			body.position.y = 1;
			group.add(body);

			// Add wheels
			const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
			const wheelMaterial = new THREE.MeshStandardMaterial({
				color: 0x111111,
				metalness: 0.5,
				roughness: 0.7
			});

			// Front wheel groups for steering
			const frontLeftWheelGroup = new THREE.Group();
			const frontRightWheelGroup = new THREE.Group();

			const frontLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
			const frontRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
			frontLeftWheel.rotation.z = Math.PI / 2;
			frontRightWheel.rotation.z = Math.PI / 2;

			frontLeftWheelGroup.add(frontLeftWheel);
			frontRightWheelGroup.add(frontRightWheel);

			frontLeftWheelGroup.position.set(-1, 0.4, 1.5);
			frontRightWheelGroup.position.set(1, 0.4, 1.5);

			group.add(frontLeftWheelGroup);
			group.add(frontRightWheelGroup);

			// Back wheels
			const backLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
			const backRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);

			backLeftWheel.rotation.z = Math.PI / 2;
			backRightWheel.rotation.z = Math.PI / 2;

			backLeftWheel.position.set(-1, 0.4, -1.5);
			backRightWheel.position.set(1, 0.4, -1.5);

			group.add(backLeftWheel);
			group.add(backRightWheel);

			// Store wheel references
			group.userData.wheels = {
				frontLeft: frontLeftWheelGroup,
				frontRight: frontRightWheelGroup,
				backLeft: backLeftWheel,
				backRight: backRightWheel
			};

			// Add vehicle type and physics properties
			group.userData.vehicleType = 'Car';
			group.userData.properties = {
				maxSpeed: 20,
				acceleration: 1.0,
				handling: 1.0,
				mass: 1000
			};

			// Position the vehicle
			group.position.copy(position);

			return group;
		}

		static createTruck(position) {
			const group = new THREE.Group();

			// Truck body
			const bodyGeometry = new THREE.BoxGeometry(2.5, 2, 6);
			const bodyMaterial = new THREE.MeshStandardMaterial({
				color: 0x4444ff,
				metalness: 0.6,
				roughness: 0.4
			});
			const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
			body.position.y = 1.5;
			group.add(body);

			// Cargo container
			const cargoGeometry = new THREE.BoxGeometry(2.4, 2, 3);
			const cargoMaterial = new THREE.MeshStandardMaterial({
				color: 0x666666,
				metalness: 0.4,
				roughness: 0.6
			});
			const cargo = new THREE.Mesh(cargoGeometry, cargoMaterial);
			cargo.position.set(0, 2.5, -1);
			group.add(cargo);

			// Add wheels (larger than car wheels)
			const wheelGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 16);
			const wheelMaterial = new THREE.MeshStandardMaterial({
				color: 0x111111,
				metalness: 0.5,
				roughness: 0.7
			});

			// Add 6 wheels (3 on each side)
			const wheelPositions = [
				[-1.2, 0.6, 2],    // Front left
				[1.2, 0.6, 2],     // Front right
				[-1.2, 0.6, 0],    // Middle left
				[1.2, 0.6, 0],     // Middle right
				[-1.2, 0.6, -2],   // Rear left
				[1.2, 0.6, -2]     // Rear right
			];

			const wheels = {};
			wheelPositions.forEach((pos, index) => {
				const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
				wheel.rotation.z = Math.PI / 2;
				wheel.position.set(...pos);

				if (index < 2) {
					// Front wheels in steering groups
					const wheelGroup = new THREE.Group();
					wheelGroup.add(wheel);
					wheelGroup.position.copy(wheel.position);
					wheel.position.set(0, 0, 0);
					group.add(wheelGroup);
					wheels[index === 0 ? 'frontLeft' : 'frontRight'] = wheelGroup;
				} else {
					group.add(wheel);
					wheels[`wheel${index}`] = wheel;
				}
			});

			group.userData.wheels = wheels;
			group.userData.vehicleType = 'Truck';
			group.userData.properties = {
				maxSpeed: 15,
				acceleration: 0.7,
				handling: 0.6,
				mass: 2500
			};

			// Position the vehicle
			group.position.copy(position);

			return group;
		}

		static createMotorcycle(position) {
			const group = new THREE.Group();

			// Motorcycle body
			const bodyGeometry = new THREE.BoxGeometry(0.8, 1, 2);
			const bodyMaterial = new THREE.MeshStandardMaterial({
				color: 0x000000,
				metalness: 0.8,
				roughness: 0.2
			});
			const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
			body.position.y = 0.7;
			group.add(body);

			// Wheel creation
			const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16);
			const wheelMaterial = new THREE.MeshStandardMaterial({
				color: 0x111111,
				metalness: 0.5,
				roughness: 0.7
			});

			// Front wheel group for steering
			const frontWheelGroup = new THREE.Group();
			const frontWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
			frontWheel.rotation.z = Math.PI / 2;
			frontWheelGroup.add(frontWheel);
			frontWheelGroup.position.set(0, 0.4, 0.8);
			group.add(frontWheelGroup);

			// Back wheel
			const backWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
			backWheel.rotation.z = Math.PI / 2;
			backWheel.position.set(0, 0.4, -0.8);
			group.add(backWheel);

			// Store wheel references
			group.userData.wheels = {
				front: frontWheelGroup,
				back: backWheel
			};

			group.userData.vehicleType = 'Motorcycle';
			group.userData.properties = {
				maxSpeed: 25,
				acceleration: 1.3,
				handling: 1.4,
				mass: 400
			};

			// Position the vehicle
			group.position.copy(position);

			return group;
		}
	}

	// Main game class
	class Game {
		constructor() {
			// Ensure DOM is fully loaded
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', () => this.init());
			} else {
				this.init();
			}
		}

		async init() {
			try {
				this.loadingManager = new LoadingManager();
				await this.initializeAsync();
			} catch (error) {
				console.error('Game initialization failed:', error);
				document.body.innerHTML = `
                        <div style="color: white; padding: 20px;">
                            Failed to initialize game. Please refresh the page.
                            <br>Error: ${error.message}
                        </div>
                    `;
			}
		}

		async initializeAsync() {
			try {
				await this.loadingManager.updateProgress(0, 'Initializing core systems...');
				this.setupCore();

				await this.loadingManager.updateProgress(20, 'Generating terrain...');
				await this.setupWorld();

				await this.loadingManager.updateProgress(60, 'Creating entities...');
				this.setupEntities();

				await this.loadingManager.updateProgress(70, 'Setting up controls...');
				this.setupControls();

				await this.loadingManager.updateProgress(80, 'Setting up physics...');
				await this.setupPhysics();

				await this.loadingManager.updateProgress(100, 'Starting game...');
				await this.startGame();
			} catch (error) {
				console.error('Initialization failed:', error);
				throw error;
			}
		}

		async startGame() {
			// Ensure all critical game objects are initialized
			if (!this.player || !this.vehicle || !this.scene || !this.camera) {
				console.error('Critical game components not initialized');
				throw new Error('Game initialization incomplete');
			}

			this.loadingManager.hideLoading();
			this.setupEventListeners();

			// Initialize control state here to ensure it exists
			this.controlState = {
				inVehicle: false,
				keys: {},
				targetZoom: GameSettings.CAMERA_BASE_DISTANCE,
				currentZoom: GameSettings.CAMERA_BASE_DISTANCE
			};

			// Start animation loop
			this.animate();
		}

		setupEventListeners() {
			// Set up key event listeners
			window.addEventListener('keydown', (e) => {
				this.controlState.keys[e.key.toLowerCase()] = true;

				// Vehicle entry/exit
				if (e.key.toLowerCase() === 'e') {
					const distance = this.player.position.distanceTo(this.vehicle.position);
					if (distance < 5) {
						this.controlState.inVehicle = !this.controlState.inVehicle;
						this.player.visible = !this.controlState.inVehicle;
					}
				}

				// Vehicle switching
				if (e.key.toLowerCase() === 'v' && this.controlState.inVehicle) {
					this.switchVehicle();
				}
			});

			window.addEventListener('keyup', (e) => {
				this.controlState.keys[e.key.toLowerCase()] = false;
			});

			// Handle window resize
			window.addEventListener('resize', () => this.handleResize());
		}

		handleResize() {
			const aspect = window.innerWidth / window.innerHeight;

			// Update main camera
			this.camera.left = -this.controlState.currentZoom * aspect;
			this.camera.right = this.controlState.currentZoom * aspect;
			this.camera.top = this.controlState.currentZoom;
			this.camera.bottom = -this.controlState.currentZoom;
			this.camera.updateProjectionMatrix();

			// Update renderer
			this.renderer.setSize(window.innerWidth, window.innerHeight);
		}

		setupCore() {
			this.scene = new THREE.Scene();
			this.setupCamera();
			this.setupRenderers();
			this.setupLighting();
			this.terrain = new TerrainGenerator();
			this.spatialHash = new SpatialHashGrid(10);
			this.clock = new THREE.Clock();
		}

		setupCamera() {
			const aspect = window.innerWidth / window.innerHeight;
			this.camera = new THREE.OrthographicCamera(
				-GameSettings.CAMERA_BASE_DISTANCE * aspect,
				GameSettings.CAMERA_BASE_DISTANCE * aspect,
				GameSettings.CAMERA_BASE_DISTANCE,
				-GameSettings.CAMERA_BASE_DISTANCE,
				1,
				2000
			);

			// Set up minimap camera
			this.minimapCamera = new THREE.OrthographicCamera(
				-100, 100,
				100, -100,
				1, 1000
			);
			this.minimapCamera.position.set(0, 100, 0);
			this.minimapCamera.lookAt(0, 0, 0);

			this.currentZoom = GameSettings.CAMERA_BASE_DISTANCE;
			this.targetZoom = GameSettings.CAMERA_BASE_DISTANCE;
			this.camera.position.set(50, 50, 50);
			this.camera.lookAt(0, 0, 0);
		}

		setupRenderers() {
			this.renderer = new THREE.WebGLRenderer({antialias: true});
			this.renderer.setSize(window.innerWidth, window.innerHeight);
			this.renderer.shadowMap.enabled = true;
			document.body.appendChild(this.renderer.domElement);

			this.minimapRenderer = new THREE.WebGLRenderer();
			this.minimapRenderer.setSize(200, 200);
			document.getElementById('minimap').appendChild(this.minimapRenderer.domElement);

			window.addEventListener('resize', () => this.handleResize());
		}

		setupLighting() {
			const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
			this.scene.add(ambientLight);

			const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
			directionalLight.position.set(50, 100, 50);
			directionalLight.castShadow = true;
			directionalLight.shadow.mapSize.width = 2048;
			directionalLight.shadow.mapSize.height = 2048;
			this.scene.add(directionalLight);
		}

		createTerrainChunk(startX) {
			const chunkSize = 400;
			const segments = 20; // Resolution of the chunk

			const geometry = new THREE.PlaneGeometry(
				chunkSize,
				chunkSize,
				segments,
				segments
			);

			// Update vertices
			const vertices = geometry.attributes.position.array;
			for (let i = 0; i < vertices.length; i += 3) {
				const x = startX + (vertices[i] * chunkSize / segments);
				const z = vertices[i + 1];
				vertices[i + 2] = this.terrain.generateHeight(x, z);
			}

			// Create materials based on ground type
			const materials = {
				road: new THREE.MeshStandardMaterial({
					color: 0x444444,
					roughness: 0.8
				}),
				grass: new THREE.MeshStandardMaterial({
					color: 0x558822,
					roughness: 0.9
				}),
				hill: new THREE.MeshStandardMaterial({
					color: 0x667733,
					roughness: 0.9
				}),
				mountain: new THREE.MeshStandardMaterial({
					color: 0x776655,
					roughness: 0.95
				})
			};

			const groundMesh = new THREE.Mesh(geometry, materials.grass);
			groundMesh.rotation.x = -Math.PI / 2;
			groundMesh.receiveShadow = true;
			this.scene.add(groundMesh);
		}

		createTreeBatch(count) {
			if (!this.treePool) {
				this.treePool = new ObjectPool(() => this.createDetailedTree(), 300);
			}

			for (let i = 0; i < count; i++) {
				const tree = this.treePool.acquire();
				let x, z;
				let attempts = 0;
				const maxAttempts = 10;

				// Try to find a valid position
				do {
					x = Math.random() * 1000 - 500;
					z = Math.random() * 1000 - 500;
					attempts++;
				} while (
					this.terrain.getDistanceToNearestRoad(x, z) < 10 &&
					attempts < maxAttempts
					);

				if (attempts < maxAttempts) {
					const y = this.terrain.generateHeight(x, z);
					tree.position.set(x, y, z);
					this.scene.add(tree);
					this.spatialHash.insert(tree);
				} else {
					this.treePool.release(tree);
				}
			}
		}

		async setupWorld() {
			// Generate roads in chunks
			for (let i = 0; i < 5; i++) {
				await new Promise(resolve => {
					setTimeout(() => {
						const start = -1000 + (i * 400);
						const end = start + 400;
						this.terrain.generateRoadsSegment(start, end);
						resolve();
					}, 0);
				});
				await this.loadingManager.updateProgress(20 + (i * 8), 'Generating roads...');
			}

			// Create ground in chunks
			const chunkSize = 400;
			const chunks = GameSettings.WORLD_SIZE / chunkSize;

			for (let i = 0; i < chunks; i++) {
				await new Promise(resolve => {
					setTimeout(() => {
						this.createTerrainChunk(i * chunkSize - GameSettings.WORLD_SIZE / 2);
						resolve();
					}, 0);
				});
				await this.loadingManager.updateProgress(40 + (i * 5), 'Creating terrain...');
			}

			// Create trees in batches
			const treeBatchSize = 20;
			const batches = GameSettings.TREE_COUNT / treeBatchSize;

			for (let i = 0; i < batches; i++) {
				await new Promise(resolve => {
					setTimeout(() => {
						this.createTreeBatch(treeBatchSize);
						resolve();
					}, 0);
				});
				await this.loadingManager.updateProgress(50 + (i * 2), 'Growing trees...');
			}
		}

		createDetailedTree() {
			const group = new THREE.Group();

			// Create more detailed trunk with bark texture simulation
			const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 4, 8);
			const trunkMaterial = new THREE.MeshStandardMaterial({
				color: 0x8B4513,
				roughness: 0.9,
				bumpScale: 0.1
			});
			const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
			trunk.castShadow = true;
			trunk.position.y = 2;
			group.add(trunk);

			// Create multiple layers of leaves with varying colors
			const leafColors = [0x228B22, 0x32CD32, 0x90EE90];
			const createLeafLayer = (y, scale, color) => {
				const leafGeometry = new THREE.ConeGeometry(scale, 2, 8);
				const leafMaterial = new THREE.MeshStandardMaterial({
					color: color,
					roughness: 0.7,
					flatShading: true
				});
				const leaves = new THREE.Mesh(leafGeometry, leafMaterial);
				leaves.castShadow = true;
				leaves.position.y = y;
				return leaves;
			};

			// Add multiple leaf layers with slight random variations
			for (let i = 0; i < 3; i++) {
				const y = 4 + i * 1.2;
				const scale = 2 - i * 0.4;
				const color = leafColors[i];
				group.add(createLeafLayer(y, scale, color));
			}

			// Add collision data
			group.userData.collider = new THREE.Sphere(
				new THREE.Vector3(0, 2, 0),
				2
			);

			return group;
		}

		createTrees() {
			// Clear existing spatial hash
			this.spatialHash.clear();

			// Create trees with improved placement strategy
			for (let i = 0; i < GameSettings.TREE_COUNT; i++) {
				const tree = this.treePool.acquire();
				let x, z;
				let attempts = 0;
				const maxAttempts = 10;

				// Try to find a valid position
				do {
					x = Math.random() * 1000 - 500;
					z = Math.random() * 1000 - 500;
					attempts++;
				} while (
					this.terrain.getDistanceToNearestRoad(x, z) < 10 &&
					attempts < maxAttempts
					);

				if (attempts < maxAttempts) {
					const y = this.terrain.generateHeight(x, z);
					tree.position.set(x, y, z);
					this.scene.add(tree);
					this.spatialHash.insert(tree);
				} else {
					this.treePool.release(tree);
				}
			}
		}

		setupPhysics() {
			this.physics = {
				gravity: -9.81,
				friction: 0.98,
				maxSpeed: 2,
				jumpForce: 5,
				groundedThreshold: 0.1,
				raycaster: new THREE.Raycaster()
			};

			// Create an invisible ground plane for raycasting
			const groundGeometry = new THREE.PlaneGeometry(
				GameSettings.WORLD_SIZE * 2,
				GameSettings.WORLD_SIZE * 2,
				200,
				200
			);
			const vertices = groundGeometry.attributes.position.array;
			for (let i = 0; i < vertices.length; i += 3) {
				const x = vertices[i];
				const z = vertices[i + 1];
				vertices[i + 2] = this.terrain.generateHeight(x, z);
			}
			groundGeometry.computeVertexNormals();

			const groundMaterial = new THREE.MeshBasicMaterial({visible: false});
			this.groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
			this.groundMesh.rotation.x = -Math.PI / 2;
			this.groundMesh.position.y = 0;
			this.scene.add(this.groundMesh);
		}

		getHeightAtPosition(position) {
			// Create ray starting from high above position
			const rayStart = new THREE.Vector3(position.x, 1000, position.z);
			this.physics.raycaster.ray.origin.copy(rayStart);
			this.physics.raycaster.ray.direction.set(0, -1, 0);

			// Intersect with ground mesh
			const intersects = this.physics.raycaster.intersectObject(this.groundMesh);

			if (intersects.length > 0) {
				return intersects[0].point.y;
			}

			// Fallback to terrain height if no intersection
			return this.terrain.generateHeight(position.x, position.z);
		}

		setupEntities() {
			// Create tree pool first
			this.treePool = new ObjectPool(() => this.createDetailedTree(), 300);

			// Set up player
			this.player = this.createHumanModel();
			this.player.position.set(0, 5, 0);
			this.scene.add(this.player);

			// Initialize vehicle array
			this.vehicles = [
				VehicleFactory.createVehicle('car', new THREE.Vector3(0, 0, 5)),
				VehicleFactory.createVehicle('truck', new THREE.Vector3(5, 0, 5)),
				VehicleFactory.createVehicle('motorcycle', new THREE.Vector3(-5, 0, 5))
			];

			this.currentVehicleIndex = 0;
			this.vehicles.forEach(vehicle => {
				this.scene.add(vehicle);
				vehicle.visible = false;
			});

			// Set initial vehicle
			this.vehicle = this.vehicles[0];
			this.vehicle.visible = true;

			// Initialize vehicle physics
			this.vehiclePhysics = new VehiclePhysics(this, this.vehicle, this.terrain);

			// Initialize chunk manager with treePool
			this.chunkManager = new ChunkManager(this.scene, this.terrain, this.treePool);

			// Player state initialization remains the same
			this.playerState = {
				velocity: new THREE.Vector3(),
				isGrounded: true,
				walkAnimation: 0,
				walkSpeed: 5,
				collider: new THREE.Sphere(
					new THREE.Vector3(),
					0.5
				)
			};
		}

		switchVehicle() {
			this.vehicle.visible = false;
			this.currentVehicleIndex = (this.currentVehicleIndex + 1) % this.vehicles.length;
			this.vehicle = this.vehicles[this.currentVehicleIndex];
			this.vehicle.visible = true;
			this.vehiclePhysics = new VehiclePhysics(this.vehicle, this.terrain);

			// Update vehicle selection display
			const vehicleSelect = document.getElementById('vehicle-select');
			if (vehicleSelect) {
				vehicleSelect.textContent = `Current Vehicle: ${this.vehicle.userData.vehicleType}`;
			}
		}

		setupControls() {
			this.controlState = {
				inVehicle: false,
				keys: {},
				targetZoom: GameSettings.CAMERA_BASE_DISTANCE,
				currentZoom: GameSettings.CAMERA_BASE_DISTANCE
			};
		}

		createHumanModel() {
			const group = new THREE.Group();

			// Enhanced human model with better proportions and details
			const materials = {
				skin: new THREE.MeshStandardMaterial({color: 0xffcc99}),
				clothes: new THREE.MeshStandardMaterial({color: 0x2244aa}),
				shoes: new THREE.MeshStandardMaterial({color: 0x111111})
			};

			// Body parts with improved geometries
			const parts = [
				{
					name: 'torso',
					geometry: new THREE.CylinderGeometry(0.25, 0.3, 1, 8),
					material: materials.clothes,
					position: [0, 0.5, 0]
				},
				{
					name: 'head',
					geometry: new THREE.SphereGeometry(0.25, 8, 8),
					material: materials.skin,
					position: [0, 1.25, 0]
				},
				// Arms with joints
				{
					name: 'leftArm',
					geometry: new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8),
					material: materials.clothes,
					position: [-0.35, 0.8, 0]
				},
				{
					name: 'rightArm',
					geometry: new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8),
					material: materials.clothes,
					position: [0.35, 0.8, 0]
				},
				// Legs with joints
				{
					name: 'leftLeg',
					geometry: new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8),
					material: materials.clothes,
					position: [-0.2, 0.1, 0]
				},
				{
					name: 'rightLeg',
					geometry: new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8),
					material: materials.clothes,
					position: [0.2, 0.1, 0]
				}
			];

			parts.forEach(part => {
				const mesh = new THREE.Mesh(part.geometry, part.material);
				mesh.position.set(...part.position);
				mesh.castShadow = true;
				mesh.name = part.name;
				group.add(mesh);
			});

			return group;
		}

		handleInput() {
			const keys = this.controlState.keys;

			if (this.controlState.inVehicle) {
				this.handleVehicleInput(keys);
			} else {
				this.handlePlayerInput(keys);
			}

			// Update camera zoom based on speed
			const speed = this.controlState.inVehicle ?
				this.vehiclePhysics.state.velocity.length() :
				this.playerState.velocity.length();

			this.controlState.targetZoom = THREE.MathUtils.lerp(
				GameSettings.CAMERA_MIN_ZOOM,
				GameSettings.CAMERA_MAX_ZOOM,
				speed / this.physics.maxSpeed
			);
		}

		handleVehicleInput(keys) {
			const state = this.vehiclePhysics.state;

			// Forward/Backward
			if (keys['w']) {
				state.engineForce = 1;
			} else if (keys['s']) {
				state.engineForce = -0.5;
			} else {
				state.engineForce = 0;
			}

			// Turn vehicle based on forward motion
			if (state.velocity.length() > 0.1) {
				if (keys['a']) {
					state.steeringAngle = Math.min(state.steeringAngle + 0.03, state.maxSteerAngle);
				} else if (keys['d']) {
					state.steeringAngle = Math.max(state.steeringAngle - 0.03, -state.maxSteerAngle);
				} else {
					// Return steering to center
					state.steeringAngle *= 0.9;
				}
			}

			// Apply brakes
			state.brakeForce = keys[' '] ? 1 : 0;
		}

		handlePlayerInput(keys) {
			const movement = new THREE.Vector3();

			if (keys['w']) movement.z -= 1;
			if (keys['s']) movement.z += 1;
			if (keys['a']) movement.x -= 1;
			if (keys['d']) movement.x += 1;

			if (movement.length() > 0) {
				movement.normalize();
				this.playerState.velocity.add(movement.multiplyScalar(0.1));
			}

			// Jump
			if (keys[' '] && this.playerState.isGrounded) {
				this.playerState.velocity.y = this.physics.jumpForce;
				this.playerState.isGrounded = false;
			}
		}

		updatePhysics(deltaTime) {
			if (this.controlState.inVehicle) {
				this.vehiclePhysics.update(deltaTime);
			} else {
				this.updatePlayerPhysics(deltaTime);
			}

			// Smooth camera zoom
			this.controlState.currentZoom = THREE.MathUtils.lerp(
				this.controlState.currentZoom,
				this.controlState.targetZoom,
				GameSettings.CAMERA_ZOOM_SPEED
			);

			this.updateCamera();
		}

		updatePlayerPhysics(deltaTime) {
			const state = this.playerState;
			const position = this.player.position;

			// Apply gravity if not grounded
			if (!state.isGrounded) {
				state.velocity.y += this.physics.gravity * deltaTime;
			}

			// Get current ground height
			const groundHeight = this.terrain.generateHeight(position.x, position.z);
			const heightAboveGround = position.y - groundHeight;

			// Ground collision check
			if (heightAboveGround <= 1.0 || position.y <= groundHeight + 1.0) {
				position.y = groundHeight + 1.0;
				state.velocity.y = 0;
				state.isGrounded = true;
			} else {
				state.isGrounded = false;
			}

			// Apply friction to horizontal movement
			state.velocity.x *= this.physics.friction;
			state.velocity.z *= this.physics.friction;

			// Clamp horizontal speed
			const horizontalVelocity = new THREE.Vector2(state.velocity.x, state.velocity.z);
			if (horizontalVelocity.length() > this.physics.maxSpeed) {
				horizontalVelocity.normalize().multiplyScalar(this.physics.maxSpeed);
				state.velocity.x = horizontalVelocity.x;
				state.velocity.z = horizontalVelocity.y;
			}

			// Calculate new position
			const movement = state.velocity.clone().multiplyScalar(deltaTime);
			const newPosition = position.clone().add(movement);

			// Get ground height at new position
			const newGroundHeight = this.terrain.generateHeight(newPosition.x, newPosition.z);
			newPosition.y = Math.max(newPosition.y, newGroundHeight + 1.0);

			// Update collider and check collisions
			state.collider.center.copy(newPosition);

			if (!this.checkCollisions(newPosition, state.collider)) {
				this.player.position.copy(newPosition);

				// Update player orientation based on movement
				if (movement.length() > 0.0001) {
					const targetRotation = Math.atan2(movement.x, movement.z);
					this.player.rotation.y = targetRotation;

					// Calculate and apply pitch based on terrain slope
					const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.player.quaternion);
					const forwardPoint = this.terrain.generateHeight(
						newPosition.x + forward.x,
						newPosition.z + forward.z
					);
					const backwardPoint = this.terrain.generateHeight(
						newPosition.x - forward.x,
						newPosition.z - forward.z
					);

					const pitchAngle = Math.atan2(forwardPoint - backwardPoint, 2);
					this.player.rotation.x = pitchAngle * 0.5;
				}

				// Update animation
				if (state.velocity.length() > 0.1) {
					state.walkAnimation += deltaTime * state.walkSpeed;
					this.animatePlayer(state.walkAnimation);
				}
			} else {
				state.velocity.multiplyScalar(-0.5);
			}
		}

		animatePlayer(time) {
			// Animate legs
			const leftLeg = this.player.getObjectByName('leftLeg');
			const rightLeg = this.player.getObjectByName('rightLeg');
			if (leftLeg && rightLeg) {
				leftLeg.position.z = Math.sin(time) * 0.2;
				rightLeg.position.z = Math.sin(time + Math.PI) * 0.2;
			}

			// Animate arms
			const leftArm = this.player.getObjectByName('leftArm');
			const rightArm = this.player.getObjectByName('rightArm');
			if (leftArm && rightArm) {
				leftArm.position.z = Math.sin(time + Math.PI) * 0.15;
				rightArm.position.z = Math.sin(time) * 0.15;
			}
		}

		checkCollisions(position, collider) {
			// Check collision with trees
			const nearbyObjects = this.spatialHash.query(
				position.x,
				position.z,
				5
			);

			for (const obj of nearbyObjects) {
				if (obj.userData.collider) {
					if (this.testCollision(collider, obj.userData.collider, obj.position)) {
						return true;
					}
				}
			}

			return false;
		}

		testCollision(collider1, collider2, position2) {
			if (collider1 instanceof THREE.Sphere && collider2 instanceof THREE.Sphere) {
				const distance = collider1.center.distanceTo(position2);
				return distance < (collider1.radius + collider2.radius);
			}
			// Add more collision tests as needed
			return false;
		}

		updateCamera() {
			if (!this.controlState || !this.player || !this.vehicle) {
				return;
			}

			const target = this.controlState.inVehicle ? this.vehicle : this.player;
			if (!target) {
				return;
			}

			// Calculate speed-based zoom factor (0 to 1)
			const currentSpeed = this.controlState.inVehicle ?
				this.vehiclePhysics.state.velocity.length() :
				this.playerState.velocity.length();

			const maxSpeed = this.controlState.inVehicle ?
				this.vehiclePhysics.state.maxSpeed :
				this.physics.maxSpeed;

			const normalizedSpeed = Math.min(currentSpeed / maxSpeed, 1);
			const zoomFactor = THREE.MathUtils.lerp(0, 0.7, normalizedSpeed); // Max zoom out is 70% of range

			// Calculate target zoom
			this.controlState.targetZoom = THREE.MathUtils.lerp(
				GameSettings.CAMERA_MIN_ZOOM,
				GameSettings.CAMERA_MAX_ZOOM,
				zoomFactor
			);

			// Smooth zoom transition
			this.controlState.currentZoom = THREE.MathUtils.lerp(
				this.controlState.currentZoom,
				this.controlState.targetZoom,
				0.05
			);

			// Get ground height at camera position
			const cameraTargetX = target.position.x + this.controlState.currentZoom;
			const cameraTargetZ = target.position.z + this.controlState.currentZoom;
			const terrainHeight = this.getHeightAtPosition(new THREE.Vector3(cameraTargetX, 0, cameraTargetZ));

			// Ensure camera stays above terrain with minimum clearance
			const minCameraHeight = terrainHeight + 20;

			// Calculate camera position
			const cameraOffset = new THREE.Vector3(
				this.controlState.currentZoom,
				Math.max(this.controlState.currentZoom, minCameraHeight),
				this.controlState.currentZoom
			);

			this.camera.position.copy(target.position).add(cameraOffset);
			this.camera.lookAt(target.position);

			// Update camera frustum
			const aspect = window.innerWidth / window.innerHeight;
			this.camera.left = -this.controlState.currentZoom * aspect;
			this.camera.right = this.controlState.currentZoom * aspect;
			this.camera.top = this.controlState.currentZoom;
			this.camera.bottom = -this.controlState.currentZoom;
			this.camera.updateProjectionMatrix();

			// Update minimap camera
			if (this.minimapCamera) {
				this.minimapCamera.position.set(
					target.position.x,
					100,
					target.position.z
				);
				this.minimapCamera.lookAt(target.position);
			}
		}

		animate() {
			try {
				requestAnimationFrame(() => this.animate());

				if (!this.clock || !this.controlState) {
					return; // Skip frame if not fully initialized
				}

				const deltaTime = this.clock.getDelta();

				// Update chunks based on camera position
				this.chunkManager.updateChunks(this.camera.position);

				this.handleInput();
				this.updatePhysics(deltaTime);

				if (this.renderer && this.scene && this.camera) {
					this.renderer.render(this.scene, this.camera);
				}

				if (this.minimapRenderer && this.minimapCamera) {
					this.minimapRenderer.render(this.scene, this.minimapCamera);
				}
			} catch (error) {
				console.error('Animation error:', error);
				// Optionally stop the animation loop on error
				// this.stopAnimation = true;
			}
		}
	}

	// Initialize game only when window is fully loaded
	window.addEventListener('load', () => {
		new Game();
	});
</script>
